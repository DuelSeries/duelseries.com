# Reference copy of the box's nginx pieces for the slither path /sl-io/ (server split, spec section 10).
# Nothing reads this file: the live config is on the box only. test/nginxSlConf.test.js checks it keeps the lines that
# matter. Measured on the box 2026-10-30: the app listens on PORT 3000 (proxy_pass http://localhost:3000), 3001 is
# free, no upstream block exists, and limit_req / limit_conn sit INSIDE `location / {`, so they are repeated below.
#
# Before editing on the box:
#   sudo cp /etc/nginx/sites-available/duelseries ~/nginx-duelseries.$(date +%F).bak
#   sudo nginx -T > ~/nginx-T.$(date +%F).txt
# Apply: sudo nginx -t && sudo systemctl reload nginx
# Check: curl -sI 'https://duelseries.com/sl-io/?EIO=4&transport=polling' | grep -i x-ds-proc
#        prints `main` while the split is off (the main server answers on 3001 too: server/ioOptions.js
#        aliasListener) and `sl` once the slither process serves it.

# ---- 1. New file /etc/nginx/conf.d/duelseries-sl.conf (http context; conf.d/*.conf is already included) ----------

# The slither process (free room + battle royale on the sl engine) on SL_CHILD_PORT 3001. The backup is the main
# server, which serves /sl-io/ itself whenever the split is off and refuses free sockets 'closed' while the child
# restarts.
upstream ds_sl {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3000 backup;
}

# ---- 2. Site /etc/nginx/sites-available/duelseries, inside the 443 `server { }` block, directly ABOVE `location / {` --

    # Free slither + battle royale sockets (engine.io path /sl-io/). Every line below except proxy_pass and the two
    # proxy_next_upstream lines is copied verbatim from `location /` underneath, its limit_req / limit_conn included.
    location /sl-io/ {
        proxy_pass http://ds_sl;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        limit_req zone=ds_req burst=400 nodelay;
        limit_conn ds_conn 60;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

# Why each copied line matters:
#   X-Forwarded-For   server/clientAddr.js believes the last hop only from a loopback peer; without it every player
#                     is 127.0.0.1 and the 31st is refused by the 30-per-address /sl gate.
#   Host              server/ownerSession.js checks Origin against Host; without it the owner's own free joins push
#                     his phone again.
#   Upgrade/Connection  without them every socket stays on long-polling (more CPU).
#   limit_req/limit_conn  they sit inside `location /` on this box, so /sl-io/ needs its own copy or loses its
#                     per-address limits.
