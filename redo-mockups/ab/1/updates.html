<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Updates | DuelSeries</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="mecard.css">
<link rel="stylesheet" href="updates.css">
</head>
<body>
<!-- Mockup switches: ?empty (nothing posted yet), ?error (the posts did not load), ?pic opens the picture viewer on a post with two pictures. -->
<main class="main" id="main">
  <section class="panel pcn" aria-labelledby="pcn-t">
    <div class="pcn-ic" id="pcn-ic"></div>
    <h1 class="t-page" id="pcn-t">Updates is on PC only</h1>
    <p class="t-body">Open duelseries.com on a computer to read what changed. Every post is there, newest first, with pictures.</p>
    <a class="btn btn-primary btn-lg btn-block" href="home.html">Back to Home</a>
  </section>

  <div class="up">
    <div class="page-hd up-hd">
      <div>
        <h1 class="t-page" id="up-t" tabindex="-1">Updates</h1>
        <p class="t-body">What changed on DuelSeries, newest first.</p>
      </div>
    </div>
    <div class="up-cols">
      <div id="feed"></div>
      <aside class="panel up-rail" id="rail" aria-label="Filter posts">
        <h2 id="show-t">Show</h2>
        <div class="fchips" id="filter" role="group" aria-labelledby="show-t"></div>
        <div class="up-key" id="key"></div>
        <button type="button" class="btn btn-secondary btn-block" id="top"></button>
      </aside>
    </div>
  </div>
</main>

<script src="../../assets/data.js"></script>
<script src="../../assets/updates-data.js"></script>
<script src="../chart.js"></script>
<script src="../kit.js"></script>
<script src="layout.js"></script>
<script src="mecard.js"></script>
<script>
(function () {
  const K = DSKit, D = K.data, I = K.icon, esc = K.esc, U = DSUI, Q = U.Q;
  const $ = id => document.getElementById(id);
  L1.chrome('updates');

  const EMPTY = Q.has('empty'), FAILED = Q.has('error');
  const TAG = { 'new': ['New', 'plus'], fix: ['Fix', 'check'], event: ['Event', 'events'], 'heads-up': ['Heads up', 'bell'] };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DATE = /^(\d{4})-(\d{2})-(\d{2})$/;
  /* picture sizes, so nothing jumps while they load */
  const SIZE = { 'pc-sidebar': [741, 800], 'game-screen-art': [1200, 750], 'clip-team': [1280, 720], 'br-join-until-start': [800, 400],
    'battle-royale-every-6-hours': [1560, 1556], 'whole-screen-clip': [1280, 800], 'lobby-sounds': [608, 286], 'updates-pictures': [1280, 800],
    'gold-card': [800, 680], 'cashout-ring': [480, 360] };
  const pic = x => x && typeof x.src === 'string' ? { src: x.src.replace(/^\.\.\//, '../../'), alt: x.alt || '', key: (x.src.match(/([a-z0-9-]+)\.webp$/) || [])[1] } : null;
  const pics = p => [pic(p.image)].concat((p.gallery || []).slice(0, 4).map(pic)).filter(Boolean);

  /* newest date first; posts on the same day keep the file's order */
  const posts = EMPTY || FAILED ? [] : (window.DS_UPDATES || []).filter(p => p && p.id && DATE.test(p.date) && p.title)
    .map((p, i) => ({ p, i })).sort((a, b) => a.p.date < b.p.date ? 1 : a.p.date > b.p.date ? -1 : a.i - b.i).map(x => x.p);
  /* not seen yet: a first visit counts the last three days as new (the live site keeps the newest seen id in this browser) */
  const cut = D.NOW - 3 * 864e5;
  const fresh = new Set(posts.filter(p => Date.parse(p.date + 'T12:00:00') >= cut).map(p => p.id));

  /* ---------- the feed ---------- */
  const PAGE = 8;
  let kind = 'all', shown = PAGE;
  const list = () => kind === 'all' ? posts : posts.filter(p => (TAG[p.tag] ? p.tag : 'new') === kind);
  function when(d) { const m = DATE.exec(d); return { day: +m[3], mon: MONTHS[+m[2] - 1] }; }
  function img(x, cls) {
    const s = SIZE[x.key];
    return '<img src="' + x.src + '" alt="' + esc(x.alt) + '"' + (s ? ' width="' + s[0] + '" height="' + s[1] + '"' : '') + ' loading="lazy" decoding="async" draggable="false">';
  }
  function post(p) {
    const t = TAG[p.tag] || TAG['new'], all = pics(p), hero = pic(p.image), rest = all.slice(hero ? 1 : 0), isNew = fresh.has(p.id);
    return '<article class="post' + (isNew ? ' is-fresh' : '') + '" aria-labelledby="t-' + p.id + '"><i class="stop" aria-hidden="true"></i>' +
      '<div class="post-tag"><span class="chip">' + I(t[1], 14) + t[0] + '</span></div>' +
      '<h2 class="post-t" id="t-' + p.id + '">' + (isNew ? '<span class="sr">Not seen yet: </span>' : '') + esc(p.title) + '</h2>' +
      (hero ? '<button type="button" class="post-pic" data-pic="' + p.id + '" data-i="0" aria-label="Open picture: ' + esc(hero.alt) + '">' + img(hero) + '</button>' : '') +
      '<div class="post-b">' + String(p.body || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean).map(s => '<p>' + esc(s) + '</p>').join('') + '</div>' +
      (rest.length ? '<div class="post-gal">' + rest.map((x, i) => '<button type="button" class="post-th" data-pic="' + p.id + '" data-i="' + (i + (hero ? 1 : 0)) +
        '" aria-label="Open picture: ' + esc(x.alt) + '">' + img(x) + '</button>').join('') + '</div>' : '') + '</article>';
  }
  function draw() {
    const feed = $('feed');
    if (FAILED || !posts.length) {
      $('rail').hidden = true;
      feed.innerHTML = '<div class="panel up-none"><div class="pcn-ic">' + I('updates', 26) + '</div>' + (FAILED
        ? '<b>Updates did not load</b><span>Check your connection, then try again.</span><button type="button" class="btn btn-secondary" id="retry">Try again</button>'
        : '<b>Nothing posted yet</b><span>Every change you can see on DuelSeries gets a short post here, most with a picture. The first one shows up here.</span><a class="btn btn-secondary" href="' + U.href('home.html') + '">Back to Home</a>') + '</div>';
      return;
    }
    const l = list(), some = l.slice(0, shown);
    const days = [];
    some.forEach(p => { const d = days[days.length - 1]; if (d && d.date === p.date) d.posts.push(p); else days.push({ date: p.date, posts: [p] }); });
    feed.innerHTML = '<ol class="tl" aria-label="Posts by day">' + days.map(d => { const w = when(d.date);
      return '<li class="day"><time class="day-d" datetime="' + d.date + '"><b>' + w.day + '</b><span>' + w.mon + '</span></time>' +
        '<div class="day-posts">' + d.posts.map(post).join('') + '</div></li>'; }).join('') + '</ol>' +
      (l.length > shown ? '<div class="up-more"><button type="button" class="btn btn-secondary" id="more">Show older posts</button><span class="t-meta">' + (l.length - shown) + ' more</span></div>'
        : '<div class="up-more"><span class="t-meta">That is every ' + (kind === 'all' ? '' : TAG[kind][0].toLowerCase() + ' ') + 'post.</span>' +
          '<button type="button" class="btn btn-quiet btn-sm" data-top>' + I('upload', 16) + 'Back to top</button></div>');
  }

  /* ---------- the rail: filter by kind, what the filled dots mean, back to top ---------- */
  const count = k => k === 'all' ? posts.length : posts.filter(p => (TAG[p.tag] ? p.tag : 'new') === k).length;
  $('filter').innerHTML = [['all', 'All']].concat(Object.keys(TAG).map(k => [k, TAG[k][0]])).filter(([k]) => count(k))
    .map(([k, n]) => '<button type="button" class="fchip" data-v="' + k + '" aria-pressed="' + (k === 'all') + '">' + n + '<small>' + count(k) + '</small></button>').join('');
  $('key').innerHTML = '<span><i class="stop is-fresh" aria-hidden="true"></i>' + (fresh.size ? fresh.size + ' posts you have not seen' : 'You have seen every post') + '</span>' +
    '<span><i class="stop" aria-hidden="true"></i>Seen before</span>';
  $('top').innerHTML = I('upload', 18) + 'Back to top';
  U.seg($('filter'), v => { kind = v; shown = PAGE; draw(); });
  function toTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); $('up-t').focus({ preventScroll: true }); }

  /* ---------- the picture viewer: the one kit sheet, arrows for a post with more than one ---------- */
  let view = null;
  function open(id, i) {
    const p = posts.find(x => x.id === id); if (!p) return;
    view = { all: pics(p), i, title: p.title };
    const many = view.all.length > 1;
    U.sheet({ bare: true, wide: true, cls: 'upv', title: 'Picture from ' + p.title,
      html: '<figure class="upv-fig"><div class="upv-stage"><img alt=""></div><figcaption class="upv-cap"><p></p>' +
        (many ? '<div class="upv-nav"><button type="button" class="btn btn-secondary btn-icon" data-prev aria-label="Previous picture">' + I('chev', 18) + '</button>' +
          '<span class="t-meta" aria-live="polite"></span><button type="button" class="btn btn-secondary btn-icon" data-next aria-label="Next picture">' + I('chev', 18) + '</button></div>' : '') +
        '</figcaption></figure>',
      focus: many ? '[data-next]' : '.sheet-x',
      onOpen(el) {
        paint(el);
        const pv = el.querySelector('[data-prev]'), nx = el.querySelector('[data-next]');
        if (pv) pv.addEventListener('click', () => step(-1));
        if (nx) nx.addEventListener('click', () => step(1));
      },
      onClose() { view = null; } });
  }
  function paint(el) {
    el = el || document.querySelector('.sheet.upv'); if (!el || !view) return;
    const x = view.all[view.i], im = el.querySelector('.upv-stage img'), s = SIZE[x.key];
    im.src = x.src; im.alt = x.alt; if (s) { im.width = s[0]; im.height = s[1]; }
    el.querySelector('.upv-cap p').textContent = x.alt;
    const n = el.querySelector('.upv-nav .t-meta'); if (n) n.textContent = (view.i + 1) + ' of ' + view.all.length;
  }
  function step(d) { if (!view || view.all.length < 2) return; view.i = (view.i + d + view.all.length) % view.all.length; paint(); }
  document.addEventListener('keydown', e => {
    if (!view || !/^Arrow(Left|Right)$/.test(e.key)) return;
    step(e.key === 'ArrowRight' ? 1 : -1); e.preventDefault();
  });

  document.addEventListener('click', e => {
    const p = e.target.closest('[data-pic]'); if (p) return open(p.dataset.pic, +p.dataset.i);
    if (e.target.closest('#more')) { const was = shown; shown += PAGE; draw();
      const h = $('feed').querySelectorAll('.post-t')[was]; if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } return; }
    if (e.target.closest('#top, [data-top]')) return toTop();
    const r = e.target.closest('#retry');
    if (r) U.busy(r, 900, () => U.toast('Still not loading', 'err', 'Mockup: open the page without ?error to see the posts.'));
  });

  $('pcn-ic').innerHTML = I('updates', 28);
  draw();
  if (Q.has('pic') && !U.PHONE.matches) { const p = posts.find(x => x.gallery && x.gallery.length); if (p) open(p.id, 0); }
})();
</script>
</body>
</html>
