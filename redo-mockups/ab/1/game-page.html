<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake: Multiplayer Snake Game, Play Free Online | DuelSeries</title>
<meta name="description" content="">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="standalone.css">
<link rel="stylesheet" href="games.css">
</head>
<body class="sa">
<!-- /games/<page> (server/gamePages.js renderPage): one live game's page for search and shared links. ?page=<page>
     picks the game (default slither-io). Same words, the VideoGame JSON-LD, Play free, and Play for money, which
     opens the lobby on that game's Free / $0.50 / $1 sheet on Free and presses nothing (the real link adds &pick=1). -->
<header class="sa-hd"><div class="sa-in">
  <a class="logo" href="home.html">Duel<span>Series</span></a><span class="sa-sp"></span>
  <a class="btn btn-secondary" href="games.html">All games</a>
</div></header>

<main class="sa-main" id="main"></main>

<footer class="sa-ft"><div class="sa-ft-in">
  <nav aria-label="Site">
    <a class="btn btn-quiet btn-sm" href="home.html">Lobby</a>
    <a class="btn btn-quiet btn-sm" href="games.html">All games</a>
    <a class="btn btn-quiet btn-sm" href="legal.html">Terms of service</a>
    <a class="btn btn-quiet btn-sm" href="#" data-stub="Privacy policy">Privacy policy</a>
    <a class="btn btn-quiet btn-sm" href="#" data-stub="Responsible play">Responsible play</a>
  </nav>
  <p id="disc"></p>
</div></footer>

<script src="../../assets/data.js"></script>
<script src="../kit.js"></script>
<script src="game-pages-data.js"></script>
<script src="games.js"></script>
<script>
(function () {
  const U = DSUI, esc = DSKit.esc, I = DSKit.icon, SITE = 'https://duelseries.com';
  const p = GP.byPage((U.Q.get('page') || 'slither-io').toLowerCase());
  /* like the server: no such page is a 404, a page whose game is not live goes to the lobby */
  if (!p) { location.replace('404.html'); return; }
  if (!GP.isLive(p)) { location.replace('home.html'); return; }
  const kind = GP.P.KIND[p.kind], live = GP.live(), others = live.filter(o => o.page !== p.page);
  const url = SITE + '/games/' + p.page;

  document.title = p.title + ' | DuelSeries';
  document.querySelector('meta[name=description]').setAttribute('content', p.description);
  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': [
    { '@type': 'VideoGame', '@id': url + '#game', name: p.name, description: p.description, url, genre: p.genre,
      gamePlatform: ['Web browser', 'PC', 'Mobile'], applicationCategory: 'GameApplication', isAccessibleForFree: true,
      playMode: p.kind === 'duel' ? ['MultiPlayer', 'SinglePlayer'] : 'MultiPlayer',
      offers: { '@type': 'Offer', price: '0', priceCurrency: 'USD', availability: 'https://schema.org/InStock', url },
      publisher: { '@type': 'Organization', name: 'DuelSeries', url: SITE + '/' } },
    { '@type': 'BreadcrumbList', itemListElement: [
      { '@type': 'ListItem', position: 1, name: 'DuelSeries', item: SITE + '/' },
      { '@type': 'ListItem', position: 2, name: 'Games', item: SITE + '/games' },
      { '@type': 'ListItem', position: 3, name: p.name, item: url }] }] });
  document.head.append(ld);
  document.getElementById('disc').textContent = '© 2026 DuelSeries. ' + GP.P.DISCLAIMER;

  /* the facts line ("Multiplayer arena · Free in your browser · ...") as kit chips */
  const facts = kind.facts.split(' · ').map(f => '<li class="chip">' + esc(f) + '</li>').join('');
  const lobby = 'home.html?game=' + p.game;

  document.getElementById('main').innerHTML =
    '<section class="gp-hero" aria-labelledby="gp-h1">' +
      '<img class="gp-art" src="' + GP.art(p) + '" alt="' + esc(p.name) + ' card art" width="360" height="540" fetchpriority="high">' +
      '<div class="gp-txt"><h1 id="gp-h1">' + esc(p.name) + '</h1>' +
        '<p class="gp-lede">' + esc(p.lede) + '</p>' +
        '<ul class="gp-facts" aria-label="About this game">' + facts + '</ul>' +
        '<div class="gp-cta">' +
          '<button type="button" class="btn btn-primary btn-xl gp-free" data-play="free">' + I('play', 20) + 'Play free</button>' +
          '<a class="btn btn-secondary btn-xl gp-paid" href="' + lobby + '" data-play="paid"><span>Play for money</span><small>' + esc(kind.paidTag) + '</small></a>' +
        '</div></div>' +
    '</section>' +
    '<div class="gp-cols">' +
      '<div class="gp-read">' +
        '<section aria-labelledby="gp-about"><h2 id="gp-about">About ' + esc(p.name) + '</h2>' + p.about.map(t => '<p>' + esc(t) + '</p>').join('') + '</section>' +
        '<section aria-labelledby="gp-howt"><h2 id="gp-howt">How to play ' + esc(p.name) + '</h2>' +
          '<dl class="gp-how">' + p.how.map(([b, t]) => '<div><dt>' + esc(b) + '</dt><dd>' + esc(t) + '</dd></div>').join('') + '</dl></section>' +
      '</div>' +
      '<section class="gp-modes" aria-labelledby="gp-modes-t"><h2 id="gp-modes-t">Free or for money</h2>' +
        '<div class="panel gp-mode"><h3>Play free</h3><p>' + esc(kind.free) + '</p></div>' +
        '<div class="panel gp-mode is-money"><h3>Play for money <span class="chip chip-money">' + esc(kind.paidTag) + '</span></h3><p>' + esc(kind.paid) +
          ' See the <a class="inl" href="legal.html">terms</a> and <a class="inl" href="#" data-stub="Responsible play">responsible play</a>.</p></div>' +
      '</section>' +
    '</div>' +
    (others.length ? '<section class="gp-more" aria-labelledby="gp-more-t"><h2 id="gp-more-t">More games</h2><div class="gx-grid gx-grid-5">' + others.map(GP.card).join('') + '</div></section>' : '');

  /* Play free: the real link drops a visitor into the free room as a guest, no sign-up */
  document.querySelector('[data-play=free]').addEventListener('click', e => {
    U.busy(e.currentTarget, 800, () => U.toast('Joining ' + p.name, 'info', 'Mockup: the free room opens here, as a guest.'));
  });
})();
</script>
</body>
</html>
