<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings | DuelSeries</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="more.css">
<link rel="stylesheet" href="mecard.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main class="main" id="main">
  <div class="page-hd"><h1 class="t-page">Settings</h1></div>
  <div class="set-grid">
    <div class="set-left" id="acct"></div>
    <div class="set-right" id="prefs"></div>
  </div>
  <div class="set-mock" id="mock"></div>
</main>

<script src="../../assets/data.js"></script>
<script src="../chart.js"></script>
<script src="../kit.js"></script>
<script src="layout.js"></script>
<script src="more.js"></script>
<script src="mecard.js"></script>
<script>
/* Settings, layout 1. Mirrors today's Settings (public/v2.html #settings-screen, drawSettings, sounds.js):
   Account (who you are, wallet address with Copy, Sign out or Sign in), Sound (lobby sounds, volume, hover sounds on
   PC), Graphics (Slither.io quality), Clips (PC only: save with P, mic, whole screen) and About (terms, privacy,
   responsible play, contact). The name field is gone from here: a name is changed only in the header profile card
   (mecard.js), which "Open profile card" opens. Contact opens the one Support sheet (more.js), as today's data-support.
   Mockup states: signed in (default), ?empty (a new account with no name yet), ?signedout. */
(function () {
  'use strict';
  const K = DSKit, D = K.data, F = K.fmt, I = K.icon, esc = K.esc, U = DSUI, me = D.me;
  L1.chrome('settings');

  const MC = window.MeCard;
  const disc = document.querySelector('.hd .me');
  const nameNow = () => MC ? MC.name : me.name;

  const CHEV = '<span class="chev">' + I('chev', 18) + '</span>';
  const PALETTE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.3 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="9.5" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/></svg>';
  const shortAddr = F.short(me.wallet);
  const looksRow = '<a class="row" href="' + U.href('customize.html') + '"><span class="row-ic">' + PALETTE + '</span><span class="row-main"><b>Customize</b><span>Your look in each game</span></span><span class="row-end">' + CHEV + '</span></a>';

  /* ---------- account ---------- */
  let mode = !U.signedIn ? 'out' : U.Q.has('empty') ? 'new' : 'in';
  const acct = document.getElementById('acct');
  function drawAcct() {
    if (mode === 'out') {
      acct.innerHTML = '<section class="panel set-acct set-out" aria-labelledby="acct-t"><h2 id="acct-t">You are signed out</h2>' +
        '<p class="t-body">Sign in to play paid rooms and use your wallet. Free rooms and the Battle Royale work without it.</p>' +
        '<button type="button" class="btn btn-primary btn-lg btn-block" data-signin>Sign in</button>' +
        '<div class="list">' + looksRow + '</div></section>';
      return;
    }
    const named = mode === 'in', nm = nameNow();
    acct.innerHTML = '<section class="panel set-acct" aria-labelledby="acct-t"><h2 class="sr" id="acct-t">Account</h2>' +
      '<div class="who"><div class="who-av' + (named ? '' : ' is-q') + '" aria-hidden="true">' + (named ? esc(nm[0].toUpperCase()) : '?') + '</div>' +
        '<div><div class="who-nm' + (named ? '' : ' is-q') + '">' + (named ? esc(nm) : 'No name yet') + '</div>' +
        '<p class="who-sub">' + (named ? 'Signed in on this device.' : 'Pick one before your first game: letters and numbers, 3 to 16.') + '</p></div>' +
        '<div class="who-edit"><p>' + (named ? 'Your name is changed in your profile card.' : 'Names are set in your profile card.') + '</p>' +
        '<button type="button" class="btn btn-secondary btn-sm" data-profile>' + (named ? 'Open profile card' : 'Set your name') + '</button></div></div>' +
      '<div class="list">' +
        '<div class="row"><span class="row-ic">' + I('wallet', 20) + '</span><div class="row-main"><b>Wallet address</b><span class="mono" title="' + me.wallet + '">' + shortAddr + '</span></div>' +
          '<div class="row-end"><button type="button" class="btn btn-secondary btn-sm" data-copy>' + I('copy', 16) + 'Copy</button></div></div>' +
        looksRow + '</div>' +
      '<button type="button" class="btn btn-danger btn-block" id="signout">Sign out</button>' +
      '<p class="t-meta bye">Your name, looks and settings stay on this device.</p></section>';
    acct.querySelector('[data-profile]').addEventListener('click', openCard);
    const so = acct.querySelector('#signout');
    so.addEventListener('click', () => U.busy(so, 900, () => { location.href = 'settings.html?signedout&bye'; }));
  }
  /* the header profile card is the one place a name changes. A new account (?empty) has no name yet: the disc shows "?"
     and the card opens on an empty field (mecard.js has no such state, so this page blanks it). A saved name, in either
     state, comes back here through the disc, which the card repaints. */
  function blank() {
    const inp = document.getElementById('mc-name'); if (!inp) return;
    document.querySelectorAll('[data-mc-nm]').forEach(e => { e.textContent = 'No name yet'; });
    document.querySelectorAll('[data-mc-ini]').forEach(e => { e.textContent = '?'; });
    inp.value = ''; inp.placeholder = 'Letters and numbers, 3 to 16';
    inp.click();
  }
  function openCard() {
    if (!MC) { U.toast('Your profile card opens here', 'info', 'Mockup: the header card holds the name field.'); return; }
    MC.open();
    if (mode === 'new') blank();
  }
  let seen = nameNow();
  function setDisc() { if (disc) disc.textContent = mode === 'new' ? '?' : nameNow()[0].toUpperCase(); }
  if (disc) {
    /* the disc's own press opens the card through mecard.js; on a new account this page then blanks it */
    disc.addEventListener('click', () => { if (mode === 'new') setTimeout(blank, 0); });
    new MutationObserver(() => {
      if (nameNow() === seen) { if (mode === 'new' && disc.textContent !== '?') setDisc(); return; }
      seen = nameNow(); if (mode === 'new') mode = 'in'; drawAcct(); syncSwitch();
    }).observe(disc, { childList: true, characterData: true, subtree: true });
  }
  drawAcct(); setDisc();
  if (U.Q.has('bye')) {
    U.toast('Signed out', 'ok', 'Your name, looks and settings stay on this device.');
    try { history.replaceState(null, '', 'settings.html?signedout'); } catch (_) {}
  }

  /* ---------- preferences (remembered per device on the real site: dsSnd, dsSndVol, dsSndHover, qual, dsClips*) ---------- */
  const S = { snd: true, vol: 70, hov: true, gfx: 'high', clips: true, mic: false, tab: false };
  const onOff = (k, lbl) => '<div class="seg" data-k="' + k + '" role="group" aria-labelledby="' + lbl + '">' +
    '<button type="button" data-v="1" aria-pressed="' + S[k] + '">On</button><button type="button" data-v="0" aria-pressed="' + !S[k] + '">Off</button></div>';
  const row = (k, label, desc, ctl, cls) => '<div class="row set-row' + (cls ? ' ' + cls : '') + '" data-row="' + k + '"><div class="row-main"><b id="l-' + k + '">' + label + '</b>' +
    (desc ? '<span>' + desc + '</span>' : '') + '</div><div class="row-end">' + ctl + '</div></div>';

  document.getElementById('prefs').innerHTML =
    '<section class="panel prefs" aria-label="Preferences">' +
      '<div class="grp" role="group" aria-labelledby="g-snd"><h2 class="grp-h" id="g-snd">Sound</h2><div class="list">' +
        row('snd', 'Lobby sounds', 'A short sound when you tap. Games keep their own.', onOff('snd', 'l-snd')) +
        row('vol', 'Volume', 'Letting go plays a tap at the new level.', '<span class="vol-wrap"><input type="range" class="vol" id="vol" min="0" max="100" step="5" value="' + S.vol + '" aria-labelledby="l-vol"><b class="vol-n" id="vol-n">' + S.vol + '%</b></span>', 'is-vol') +
        row('hov', 'Hover sounds', 'A soft tick when the mouse moves onto a button.', onOff('hov', 'l-hov'), 'set-pc') +
      '</div></div>' +
      '<div class="grp" role="group" aria-labelledby="g-gfx"><h2 class="grp-h" id="g-gfx">Graphics</h2><div class="list">' +
        row('gfx', 'Quality', 'High is the default. Low turns off the food glow in Slither.io so big fights stay smooth on slower devices.',
          '<div class="seg" data-k="gfx" role="group" aria-labelledby="l-gfx"><button type="button" data-v="high" aria-pressed="true">High</button><button type="button" data-v="low" aria-pressed="false">Low</button></div>') +
      '</div></div>' +
      '<div class="grp set-pc" role="group" aria-labelledby="g-clip"><h2 class="grp-h" id="g-clip">Clips<small>On a computer only</small></h2><div class="list">' +
        row('clips', 'Save clips with P', 'The last 30 seconds of a game as an MP4 in your Downloads, with the end card, chat and HUD in it.', onOff('clips', 'l-clips')) +
        row('mic', 'Add my mic', 'Your voice in saved clips. Your browser asks first.', onOff('mic', 'l-mic')) +
        row('tab', 'Record the whole screen', 'Adds the lobby, its tabs and your mouse. Your browser asks once per visit and shows its sharing bar.', onOff('tab', 'l-tab')) +
      '</div></div>' +
    '</section>' +
    '<nav class="panel about" aria-labelledby="g-about"><h2 class="grp-h" id="g-about">About</h2><div class="list">' +
      /* Refer a friend has no bottom bar tab, so a phone reaches it here (the PC sidebar has it too) */
      [['Refer a friend', 'Send a friend a link to a free game', 'href="' + U.href('refer.html') + '"'], ['Terms of service', '', 'href="' + U.href('legal.html') + '"'], ['Privacy policy', '', 'href="#" data-stub="Privacy policy"'],
     ['Responsible play', '', 'href="#" data-stub="Responsible play"'], ['Contact', 'Email or Discord', 'href="#" data-help="help"']].map(([l, sub, attrs]) =>
        '<a class="row set-row" ' + attrs + '><span class="row-main"><b>' + l + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</span><span class="row-end">' + CHEV + '</span></a>').join('') +
    '</div></nav>';

  const prefs = document.getElementById('prefs');
  const vol = document.getElementById('vol'), volN = document.getElementById('vol-n');
  const segs = {};
  function setSeg(k, on) {
    const box = prefs.querySelector('.seg[data-k="' + k + '"]');
    box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === on)));
  }
  /* what depends on what, as today: sound off shuts volume and hover; clips off shuts mic and whole screen (shown off) */
  function apply() {
    const dim = (k, off) => {
      const r = prefs.querySelector('[data-row="' + k + '"]'); r.classList.toggle('is-off', off);
      r.querySelectorAll('button, input').forEach(x => { x.disabled = off; });
    };
    dim('vol', !S.snd); dim('hov', !S.snd); dim('mic', !S.clips); dim('tab', !S.clips);
    setSeg('mic', S.clips && S.mic); setSeg('tab', S.clips && S.tab);
    vol.style.setProperty('--v', vol.value + '%'); volN.textContent = vol.value + '%';
  }

  /* the tap, so the volume can be heard: a short glassy tick like the lobby's own */
  let ac = null;
  function tick(level, hi) {
    if (!S.snd) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(hi ? 2400 : 2100, t); o.frequency.exponentialRampToValueAtTime(1700, t + 0.03);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.16 * level), t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.07);
    } catch (_) {}
  }

  prefs.querySelectorAll('.seg[data-k]').forEach(box => {
    const k = box.dataset.k;
    segs[k] = U.seg(box, v => {
      if (k === 'gfx') { S.gfx = v; return; }
      S[k] = v === '1';
      if (k === 'snd' && S.snd) tick(vol.value / 100, true);
      if (k === 'mic' && S.mic) U.toast('Mic on for clips', 'ok', 'Only clips you save have it. Nothing is sent anywhere.');
      if (k === 'tab' && S.tab) U.toast('Your browser asks to share this tab', 'info', 'Mockup: the real site asks here, once per visit.');
      apply();
    });
  });
  vol.addEventListener('input', () => { S.vol = +vol.value; apply(); });
  vol.addEventListener('change', () => tick(vol.value / 100));
  apply();

  /* ---------- mockup state switcher (the foot of the page, never over the screen) ---------- */
  let ready = false;
  K.states([['in', 'Signed in'], ['new', 'New account'], ['out', 'Signed out']], s => {
    if (!ready) return;
    if (s === 'out') { if (U.signedIn) location.href = 'settings.html?signedout'; return; }
    if (!U.signedIn) { location.href = 'settings.html' + (s === 'new' ? '?empty' : ''); return; }
    mode = s; drawAcct(); setDisc();
    try { history.replaceState(null, '', 'settings.html' + (s === 'new' ? '?empty' : '')); } catch (_) {}
  });
  ready = true;
  const sw = document.querySelector('.ds-states');
  function syncSwitch() { if (sw) sw.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === mode)); }
  if (sw) { sw.classList.add('is-static'); document.getElementById('mock').append(sw); syncSwitch(); }
})();
</script>
</body>
</html>
