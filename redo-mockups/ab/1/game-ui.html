<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In-game UI | DuelSeries</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="game-ui.css">
</head>
<body class="gu">
<!-- the game: a crop of its card art, blurred and dimmed (the empty arena draws the whole map instead) -->
<div class="gf is-end" id="gf" aria-hidden="true">
  <img id="gf-img" src="../../assets/img/knockout-card.webp" alt="">
  <svg class="gf-map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="hx" width="20.78" height="36" patternUnits="userSpaceOnUse">
        <rect width="20.78" height="36" fill="#141414"/>
        <g fill="none" stroke="#2a2a2a" stroke-width="1.4">
          <path d="M10.39 0L20.78 6V18L10.39 24L0 18V6Z"/>
          <path d="M0 18L10.39 24V36L0 42L-10.39 36V24Z"/>
          <path d="M20.78 18L31.17 24V36L20.78 42L10.39 36V24Z"/>
          <path d="M0 -18L10.39 -12V0L0 6L-10.39 0V-12Z"/>
          <path d="M20.78 -18L31.17 -12V0L20.78 6L10.39 0V-12Z"/>
        </g>
      </pattern>
    </defs>
    <circle cx="500" cy="500" r="430" fill="url(#hx)" stroke="#800000" stroke-width="12"/>
  </svg>
</div>

<main id="main">
  <h1 class="sr">DuelSeries game screen</h1>
  <div class="gu-tl" id="tl"></div>
  <div class="gu-tc" id="tc" role="status" aria-live="polite"></div>

  <section class="ch" id="chat" aria-label="Chat" hidden>
    <div class="ch-feed" id="feed" role="log" aria-live="polite"></div>
    <form class="ch-row" id="chatform" autocomplete="off">
      <div class="ch-in"><input class="input" id="chatin" maxlength="120" enterkeyhint="send" aria-label="Chat message"><span class="ch-count" id="chatcount" aria-hidden="true"></span></div>
      <button type="submit" class="btn btn-primary btn-icon ch-send" aria-label="Send"></button>
      <button type="button" class="btn btn-quiet btn-icon" id="chatmute" aria-pressed="false" aria-label="Hide chat" title="Hide chat"></button>
    </form>
    <button type="button" class="ch-hint" id="chathint"><kbd>T</kbd>Chat</button>
  </section>

  <div class="gu-veil" id="veil"></div>

  <div class="sw" id="sw" hidden>
    <button type="button" class="btn btn-secondary gu-glass sw-arrow is-prev" id="sw-prev" aria-label="Previous player" title="Previous player (Left arrow)"></button>
    <div class="sw-plate" id="sw-plate" role="status" aria-live="polite"></div>
    <button type="button" class="btn btn-secondary gu-glass sw-arrow" id="sw-next" aria-label="Next player" title="Next player (Right arrow or Space)"></button>
  </div>

  <div class="pf" id="pf" aria-hidden="true"><span class="pf-p"><i class="pf-dot" id="pf-dot"></i><b id="pf-ms">-- ms</b></span><span class="pf-f">FPS <b id="pf-fps">60</b></span></div>
</main>

<nav class="mk" id="mk" aria-label="Mockup state"></nav>

<script src="../../assets/data.js"></script>
<script src="../chart.js"></script>
<script src="../kit.js"></script>
<script src="game-ui.js"></script>
</body>
</html>
