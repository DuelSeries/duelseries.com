<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support | DuelSeries</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="mecard.css">
<link rel="stylesheet" href="more.css">
<link rel="stylesheet" href="support.css">
</head>
<body>
<!-- Support. Today (public/js/v2/support.js) every "write to us" link opens one panel: the address with Copy, Open in
     Gmail (a new tab, never mailto:) and Ask on Discord; Report a bug and Send an idea open it prefilled. Here the
     panel's content is the page, and the prefilled ones open the kit sheet (more.js support). The footer's other
     pages sit under it. ?sheet=bug|idea|help opens a sheet on load. -->
<main class="main" id="main">
  <div class="sup">
    <div class="page-hd sup-hd"><div>
      <h1 class="t-page">Support</h1>
      <p class="t-body">Email us, or ask in the Discord.</p>
    </div></div>

    <div class="sup-grid">
      <section class="panel sup-mail" aria-labelledby="sup-mail-t">
        <h2 class="t-label" id="sup-mail-t">Our email</h2>
        <p class="sup-addr" id="sup-addr"></p>
        <div class="sup-acts">
          <a class="btn btn-primary btn-lg" id="sup-gmail" target="_blank" rel="noopener noreferrer"><span class="sup-i" data-i="ext"></span>Open in Gmail</a>
          <button type="button" class="btn btn-secondary btn-lg cp" id="sup-copy"><span class="sup-i" data-i="copy"></span><span data-lbl>Copy address</span></button>
          <a class="btn btn-secondary btn-lg" id="sup-dc" target="_blank" rel="noopener noreferrer"><span class="sup-i" data-i="discord"></span>Ask on Discord</a>
        </div>
        <p class="t-meta sup-note">Gmail opens in a new tab with our address filled in, so you do not need a mail app.</p>
      </section>

      <section class="panel sup-top" aria-labelledby="sup-top-t">
        <div class="panel-head"><h2 id="sup-top-t">What is it about?</h2></div>
        <div class="sup-opts">
          <button type="button" class="opt" data-help="bug"><span class="opt-ic" data-i="bug"></span><span><b>Report a bug</b><small>Which game, what happened and roughly when.</small></span><span data-i="chev"></span></button>
          <button type="button" class="opt" data-help="idea"><span class="opt-ic" data-i="idea"></span><span><b>Send an idea</b><small>What you would add or change.</small></span><span data-i="chev"></span></button>
          <button type="button" class="opt" data-help="help"><span class="opt-ic" data-i="help"></span><span><b>Something else</b><small>Your wallet, a game, your account, anything.</small></span><span data-i="chev"></span></button>
        </div>
      </section>
    </div>

    <nav class="sup-more" aria-labelledby="sup-more-t">
      <h2 class="t-label" id="sup-more-t">Other pages</h2>
      <div class="sup-links">
        <a class="btn btn-quiet" href="games.html">Game guides</a>
        <a class="btn btn-quiet" href="legal.html">Terms of service</a>
        <button type="button" class="btn btn-quiet" data-stub="Privacy policy">Privacy policy</button>
        <button type="button" class="btn btn-quiet" data-stub="Responsible play">Responsible play</button>
      </div>
    </nav>
  </div>
</main>

<script src="../../assets/data.js"></script>
<script src="../chart.js"></script>
<script src="../kit.js"></script>
<script src="layout.js"></script>
<script src="mecard.js"></script>
<script src="more.js"></script>
<script>
(function () {
  const K = DSKit, I = K.icon, U = DSUI, M = L1More;
  L1.chrome('support');

  document.querySelectorAll('[data-i]').forEach(s => {
    const n = s.dataset.i, big = s.classList.contains('opt-ic');
    if (n === 'copy') { s.outerHTML = M.copyIcons().replace(/width="16" height="16"/g, 'width="18" height="18"'); return; }
    s.outerHTML = big ? '<span class="opt-ic">' + I(n, 20) + '</span>' : I(n, 18);
  });

  /* the address breaks after the @ when it has to, never inside a word */
  const [user, host] = M.MAIL.split('@');
  document.getElementById('sup-addr').innerHTML = user + '<wbr>@' + host;
  document.getElementById('sup-gmail').href = M.gmail();
  document.getElementById('sup-dc').href = M.DISCORD;
  const copy = document.getElementById('sup-copy');
  copy.addEventListener('click', () => M.copy(copy, M.MAIL, 'Email copied', M.MAIL));

  const s = U.Q.get('sheet'); if (s) M.support(s);
})();
</script>
</body>
</html>
