<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DuelSeries</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../kit.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="mecard.css">
</head>
<body>
<main class="main" id="main">
  <section class="wins" aria-label="Live wins">
    <div class="wins-lbl"><span><i class="dot is-pulse"></i>Live wins</span><small>From paid rooms</small></div>
    <div class="wins-track" id="wins"></div>
  </section>

  <section class="br-card brh" aria-labelledby="brh-t">
    <img class="br-art" src="../../assets/img/snake-card.webp" alt="">
    <div class="brh-txt">
      <div class="brh-tags" id="brh-tags"><span class="chip chip-money">Free entry</span><span class="chip brh-every">Every 6 hours</span></div>
      <h2 class="t-page brh-t" id="brh-t">Battle Royale</h2>
      <p class="brh-prize money">$20 to 1st</p>
    </div>
    <div class="clockbox">
      <span class="t-label" id="brh-lbl">Next match in</span>
      <b class="num" data-brclock>02:16:42</b>
      <span class="t-meta brh-meta" id="brh-meta"></span>
    </div>
    <a class="btn btn-secondary btn-lg" id="br-go" href="events.html">Open the event</a>
  </section>

  <section aria-labelledby="games-t">
    <div class="sec-hd games-hd">
      <h2 id="games-t">Games</h2>
      <div class="seg" id="filter" aria-label="Show games"></div>
    </div>
    <div class="ggrid" id="grid"></div>
  </section>
</main>

<script src="../../assets/data.js"></script>
<script src="../chart.js"></script>
<script src="../kit.js"></script>
<script src="layout.js"></script>
<script src="mecard.js"></script>
<script>
(function () {
  const U = DSUI;
  L1.chrome('home');
  const go = document.getElementById('br-go');
  go.href = U.href('events.html');

  /* the banner follows the one shared Battle Royale state. Its tag stays still: Live wins is the one pulse on Home */
  const m = U.brModel(U.brState());
  document.getElementById('brh-tags').insertAdjacentHTML('afterbegin', m.tag.replace(' data-pulse', ''));
  document.getElementById('brh-lbl').textContent = m.clockLabel;
  document.getElementById('brh-meta').textContent = m.soon ? 'Joining is open until the 2:00 AM ET start'
    : m.live ? 'Doors open again at ' + m.opensAt : 'Joining opens at ' + m.opensAt + ', 10 min before the start';
  if (m.soon || m.live) go.classList.replace('btn-secondary', 'btn-primary');

  /* Live wins: the site's own strip plus the board's latest cash-outs (static amounts) */
  document.getElementById('wins').innerHTML = U.wins(14).map(U.winHTML).join('');

  /* every game, in the live lobby's order; Coming soon sits at the end */
  const grid = document.getElementById('grid');
  grid.innerHTML = U.gamesHTML();
  const c = U.counts(), filter = document.getElementById('filter');
  filter.innerHTML = '<button type="button" data-v="all" aria-pressed="true">All<small>' + c.all + '</small></button>' +
    '<button type="button" data-v="rooms">Big rooms<small>' + c.rooms + '</small></button>' +
    '<button type="button" data-v="duels">1 v 1<small>' + c.duels + '</small></button>' +
    '<button type="button" data-v="soon"><span class="f-lg">Coming soon</span><span class="f-sm">Soon</span><small>' + c.soon + '</small></button>';
  /* 3 across on a phone: a lone card on the last row becomes one full-width tile, so the grid always ends on a full row */
  function shape() {
    const vis = [...grid.children].filter(card => !card.hidden);
    grid.querySelectorAll('.is-tail').forEach(card => card.classList.remove('is-tail'));
    if (vis.length > 1 && vis.length % 3 === 1) vis[vis.length - 1].classList.add('is-tail');
  }
  U.seg(filter, v => { grid.querySelectorAll('.gcard').forEach(card => { card.hidden = v !== 'all' && card.dataset.kind !== v; }); shape(); });
  shape();

  const q = U.Q.get('game'); if (q) U.stake(q);
})();
</script>
</body>
</html>
