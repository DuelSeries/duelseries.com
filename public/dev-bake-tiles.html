<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sprite bake</title>
<style>
 body{margin:0;background:#111;color:#ddd;font:12px system-ui;padding:12px}
 canvas{image-rendering:pixelated;background:#222;display:block;margin:8px 0}
 #log{white-space:pre-wrap;font-family:ui-monospace,monospace;color:#9c9}
</style></head>
<body>
<div id="log">baking…</div>
<canvas id="atlas"></canvas>
<script src="js/shooterArt.js"></script>
<script>
/* ─── The tile bake ───────────────────────────────────────────────────────────
   Draws every ground tile once, at four times its on-screen size, then does the
   per-pixel work a live renderer cannot afford sixty times a second across
   three hundred tiles:

     grain        multiplicative brightness noise, so a flat fill stops being flat
     edge shade   darkening that follows the shape's own alpha edge
     light        a soft top-left falloff across the whole tile

   That third pass is what actually sells it. Hand-drawn art has a light
   direction; procedural fills do not, and the eye reads the difference long
   before it can name it.

   Output is one atlas PNG on a fixed grid. No JSON: the order below is the
   contract, and the game repeats it. */

const A = window.ShooterArt;
const CELL = 108;              // 2x the 54px tile, retina at the size these actually draw
const PAD = 4;                 // gutter around every cell
const STEP = CELL + PAD * 2;   // cell pitch in the atlas
const COLS = 8;
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

/* The contract. Index in this list IS the frame index. */
const FRAMES = [
  ['grass', 0], ['grass', 1], ['grass', 2], ['grass', 3],
  ['stone', 0], ['stone', 1], ['stone', 2],
  ['brick', 0], ['brick', 1],
  ['wood',  0], ['wood',  1],
  ['crate', 0],
  ['barrel', 0],
];

function drawBase(g, kind, variant) {
  // Variants come from the seeded hash the art module already uses, so a
  // "different" stone is the same function with a different cell coordinate.
  const c = 7 + variant * 13, r = 3 + variant * 5;
  if (kind === 'grass')  return A.drawGrass(g, 0, 0, CELL, c, r);
  if (kind === 'stone')  return A.drawStone(g, 0, 0, CELL, c, r);
  if (kind === 'brick')  return A.drawBrick(g, 0, 0, CELL, c, r);
  if (kind === 'wood')   return A.drawWood(g, 0, 0, CELL, c, r);
  if (kind === 'crate')  return A.drawCrate(g, 0, 0, CELL);
  if (kind === 'barrel') return A.drawBarrel(g, 0, 0, CELL);
}

/* Deterministic value noise, so a rebake produces a byte-identical atlas and
   the file does not churn in git every time this is run. */
function rnd(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function postProcess(g, seed, opts) {
  const img = g.getImageData(0, 0, CELL, CELL);
  const d = img.data;
  const R = rnd(seed);
  const grain = opts.grain === undefined ? 0.13 : opts.grain;

  // A coarse noise field, sampled bilinearly, so the grain has structure
  // rather than being per-pixel static (which reads as video noise, not paint).
  const N = 28;
  const field = new Float32Array(N * N);
  for (let i = 0; i < field.length; i++) field[i] = R() * 2 - 1;
  const sample = (x, y) => {
    const fx = x / CELL * (N - 1), fy = y / CELL * (N - 1);
    const x0 = fx | 0, y0 = fy | 0;
    const x1 = Math.min(N - 1, x0 + 1), y1 = Math.min(N - 1, y0 + 1);
    const tx = fx - x0, ty = fy - y0;
    const a = field[y0 * N + x0] * (1 - tx) + field[y0 * N + x1] * tx;
    const b = field[y1 * N + x0] * (1 - tx) + field[y1 * N + x1] * tx;
    return a * (1 - ty) + b * ty;
  };

  for (let y = 0; y < CELL; y++) {
    for (let x = 0; x < CELL; x++) {
      const i = (y * CELL + x) * 4;
      if (d[i + 3] === 0) continue;

      // grain: coarse field plus a little fine sparkle
      let k = 1 + (sample(x, y) * 0.7 + (R() * 2 - 1) * 0.3) * grain;

      // light: soft falloff from the top-left, which gives the tile a direction
      const lx = x / CELL, ly = y / CELL;
      k *= 1 + opts.light * (0.62 - (lx * 0.45 + ly * 0.55));

      d[i]     = Math.max(0, Math.min(255, d[i]     * k));
      d[i + 1] = Math.max(0, Math.min(255, d[i + 1] * k));
      d[i + 2] = Math.max(0, Math.min(255, d[i + 2] * k));
    }
  }
  g.putImageData(img, 0, 0);

  /* Edge shade. Everything inside the shape, near its alpha edge, gets darker.
     On a full-bleed tile that reads as the tile sitting slightly below its
     neighbours; on a crate or a barrel it reads as contact shadow. */
  if (opts.edge) {
    const src = g.getImageData(0, 0, CELL, CELL);
    const sd = src.data;
    const out = g.getImageData(0, 0, CELL, CELL);
    const od = out.data;
    const RAD = Math.round(CELL * 0.075);
    for (let y = 0; y < CELL; y++) {
      for (let x = 0; x < CELL; x++) {
        const i = (y * CELL + x) * 4;
        if (sd[i + 3] === 0) continue;
        const near = Math.min(x, y, CELL - 1 - x, CELL - 1 - y);
        if (near >= RAD) continue;
        const k = 1 - (1 - near / RAD) * opts.edge;
        od[i] = sd[i] * k; od[i + 1] = sd[i + 1] * k; od[i + 2] = sd[i + 2] * k;
      }
    }
    g.putImageData(out, 0, 0);
  }
}

const OPTS = {
  /* Ground gets grain and NOTHING else. A light direction on a full-bleed
     tile means every tile is bright at the top left and dark at the bottom
     right, and tiling that produces a visible grid across the whole floor. Only
     things that stand UP off the ground get a light direction. */
  grass:  { grain: 0.10, light: 0, edge: 0 },
  stone:  { grain: 0.10, light: 0.16, edge: 0.28 },
  brick:  { grain: 0.14, light: 0.14, edge: 0.26 },
  wood:   { grain: 0.15, light: 0.15, edge: 0.26 },
  crate:  { grain: 0.11, light: 0.18, edge: 0.00 },
  barrel: { grain: 0.10, light: 0.20, edge: 0.00 },
};

(async function () {
  const rows = Math.ceil(FRAMES.length / COLS);
  const atlas = document.getElementById('atlas');
  atlas.width = COLS * STEP;
  atlas.height = rows * STEP;
  const ag = atlas.getContext('2d');

  FRAMES.forEach(([kind, variant], idx) => {
    const c = document.createElement('canvas');
    c.width = CELL; c.height = CELL;
    const g = c.getContext('2d');
    drawBase(g, kind, variant);
    postProcess(g, 1000 + idx * 7919, OPTS[kind]);

    const ox = (idx % COLS) * STEP + PAD;
    const oy = ((idx / COLS) | 0) * STEP + PAD;
    ag.drawImage(c, ox, oy);
    /* Edge extrude: repeat the outermost row and column out into the gutter,
       so a bilinear sample that strays past the frame finds more of the same
       tile rather than the one packed beside it. */
    ag.drawImage(c, 0, 0, 1, CELL, ox - PAD, oy, PAD, CELL);
    ag.drawImage(c, CELL - 1, 0, 1, CELL, ox + CELL, oy, PAD, CELL);
    ag.drawImage(c, 0, 0, CELL, 1, ox, oy - PAD, CELL, PAD);
    ag.drawImage(c, 0, CELL - 1, CELL, 1, ox, oy + CELL, CELL, PAD);
    ag.drawImage(c, 0, 0, 1, 1, ox - PAD, oy - PAD, PAD, PAD);
    ag.drawImage(c, CELL - 1, 0, 1, 1, ox + CELL, oy - PAD, PAD, PAD);
    ag.drawImage(c, 0, CELL - 1, 1, 1, ox - PAD, oy + CELL, PAD, PAD);
    ag.drawImage(c, CELL - 1, CELL - 1, 1, 1, ox + CELL, oy + CELL, PAD, PAD);
  });

  log('atlas ' + atlas.width + 'x' + atlas.height + ', ' + FRAMES.length + ' frames, cell ' + CELL + ', pad ' + PAD + ', step ' + STEP);

  const blob = await new Promise(r => atlas.toBlob(r, 'image/png'));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tiles.png';
  a.textContent = 'Download tiles.png (' + Math.round(blob.size / 1024) + ' KB), then drop it in public/img/shooter/';
  a.style.cssText = 'display:inline-block;margin:10px 0;color:#9cf';
  document.body.insertBefore(a, document.getElementById('atlas'));
  log('ready (' + Math.round(blob.size / 1024) + ' KB) - use the download link above');
  window.__baked = true;
})();
</script>
</body></html>
