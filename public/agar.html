<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/posthog-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <title>DuelSeries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/cashout.css" />
  <link rel="stylesheet" href="/css/agar.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud-leaderboard">
    <div class="hud-lb-title" id="hud-lb-title">LEADERBOARD</div>
    <div id="hud-lb-rows"></div>
  </div>

  <div id="hud-bottomright">
    <div id="agar-ping-display"><span id="agar-ping-dot" class="ping-dot ping-green"></span><span id="agar-ping-value">-- ms</span></div>
    <div id="agar-fps-counter">FPS: --</div>
  </div>

  <!-- Death screen -->
  <div id="death-screen" role="dialog" aria-modal="true" aria-labelledby="death-title">
    <div class="co-card">
      <p class="co-eyebrow" id="death-title">You were eaten</p>
      <!-- agar.js hides #death-earned-row when there is nothing to pay out, so
           it wraps the figure and its caption together: hiding the caption on
           its own would leave a stray $0.00 sitting above the score. -->
      <div id="death-earned-row" style="display:none">
        <p class="co-amount" id="death-earned-val">$0.00</p>
        <p class="co-sub">paid to your wallet</p>
      </div>
      <p class="co-stats">Score <b id="death-score-val">0</b></p>
      <!-- Play again in the MIDDLE, with watching and leaving either side of
           it. It is the one thing most people want after dying, and the middle
           of three is where a thumb already is. -->
      <div class="co-btns">
        <button class="co-btn co-ghost" id="btn-spectate">Keep watching</button>
        <button class="co-btn co-go" id="btn-respawn">Play again</button>
        <button class="co-btn co-ghost" id="btn-death-lobby">Lobby</button>
      </div>
    </div>
  </div>

  <!-- Spectate bar -->
  <div id="spectate-bar">
    <button id="spectate-prev">&#8592;</button>
    <span id="spectate-label">Spectating: —</span>
    <button id="spectate-next">&#8594;</button>
    <button id="spectate-play-again">&#9654; Play Again</button>
    <button id="spectate-stop">&#8592; Lobby</button>
  </div>

  <!-- Cashout screen -->
  <div id="cashout-overlay" role="dialog" aria-modal="true" aria-labelledby="cashout-title">
    <div class="co-card">
      <p class="co-eyebrow" id="cashout-title">Cashed out</p>
      <div id="cashout-worth-row" style="display:none">
        <p class="co-amount" id="cashout-worth-val">$0.00</p>
        <p class="co-sub">paid to your wallet</p>
      </div>
      <p class="co-stats">Score <b id="cashout-score-val">0</b></p>
      <div class="co-btns">
        <button class="co-btn co-ghost" id="btn-cashout-spectate">Keep watching</button>
        <button class="co-btn co-go" id="btn-cashout-respawn">Play again</button>
        <button class="co-btn co-ghost" id="btn-cashout-lobby">Lobby</button>
      </div>
    </div>
  </div>

  <!-- Admin console -->
  <div id="admin-console" class="hidden">
    <div id="admin-console-inner">
      <span id="admin-console-prompt">&#62;</span>
      <input id="admin-input" type="text" autocomplete="off" spellcheck="false" placeholder="bot 3" maxlength="40" />
    </div>
  </div>

  </div>

  <!-- Mobile action buttons (hidden on desktop via CSS) -->
  <div id="agar-mobile-btns">
    <button id="agar-btn-cashout" class="agar-mobile-btn">CASH OUT</button>
    <button id="agar-btn-split" class="agar-mobile-btn">SPLIT</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/agar.js"></script>
</body>
</html>
