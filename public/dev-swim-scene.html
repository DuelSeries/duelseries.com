<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Swim scene (dev)</title>
<link rel="icon" href="/favicon.svg">
<!-- Dev only: the Swim renderer (js/swim/swimScene.js) on its own, with made-up
     traffic and a fake car weaving at 120 to 250 km/h, so its look and its
     frame cost can be checked without a server race. scripts/swimScenePerf.js
     drives it headless and reads window.__swimPerf.
     Keys: N near miss, C crash, R reset, F follow the other car, H hide this text.
     Query: secs=N (measure N s then set __swimPerf.done), sync=1 (finish the GPU
     every frame, for true frame cost), t=S (race time to start at: denser later),
     fixed=1 (fixed 1/60 s steps), demo=1 (a near miss every 2.5 s), crashAt=S,
     adaptive=0, maxdpr=X, aa=0|1, seed=N, hud=0. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: #fff;
         background: rgba(0,0,0,.5); padding: 6px 9px; border-radius: 6px; pointer-events: none; white-space: pre; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
<script src="/shared/swimSim.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script type="module" src="/js/swim/swimSceneDev.js"></script>
</body>
</html>
