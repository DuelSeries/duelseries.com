<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Battleship · DuelSeries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/battleship.css">
</head>
<body>

<!-- The clock and the state of the match. One strip, because how long is left
     and whose move it is are read together. -->
<header id="top" hidden>
  <div class="side">
    <span class="who" id="youName">You</span>
    <span class="fleetbar" id="youBar" aria-label="Your fleet"></span>
  </div>
  <div class="clock">
    <span class="num" id="clockNum">30</span>
    <span class="lbl" id="clockLbl">Place</span>
  </div>
  <div class="side them">
    <span class="who" id="themName">Opponent</span>
    <span class="fleetbar" id="themBar" aria-label="Their fleet"></span>
  </div>
</header>

<!-- The fleet rail and the boards, side by side.

     The rail holds your five ships standing on end down the left, which is
     where they are while you are placing them and nowhere at all afterwards.
     Along the bottom they were competing with the boards for the one dimension
     a phone has none of; on the left they cost 68 pixels of width, which a
     phone has.

     WHILE PLACING, THEIR BOARD IS NOT DRAWN. It is empty, nothing can be done
     to it, and hiding it hands its entire half of the screen to the board you
     are actually working on — which is the half of this game that needed the
     room. Both are back the moment the shooting starts. -->
<!-- The board, and the fleet waiting under it.

     The ships were down the left for one round and Owen sent them back: under
     the board is where your thumb already is, and the drag is straight up onto
     the water rather than across it. WHILE PLACING, THEIR BOARD IS NOT DRAWN —
     it is empty and nothing can be done to it, so its half of the screen goes
     to the one you are working on. Both are back when the shooting starts. -->
<div id="stage" hidden>
  <main id="boards">
    <section class="boardwrap" id="wrapTheirs">
      <h2 class="bt them" id="foeTitle">Opponent</h2>
      <div class="pane"><canvas id="theirs" width="520" height="520"></canvas></div>
    </section>
    <section class="boardwrap" id="wrapMine">
      <h2 class="bt" id="myTitle">Your waters</h2>
      <div class="pane"><canvas id="mine" width="520" height="520"></canvas></div>
    </section>
  </main>

  <section id="dock" hidden>
    <div id="tray"></div>
    <div class="dockbtns">
      <button type="button" id="auto" class="mini">Auto</button>
      <button type="button" id="rotFab" hidden class="mini turnbtn">Turn</button>
      <button type="button" id="confirm" class="mini go" disabled>Confirm fleet</button>
    </div>
    <div class="railhd"><span id="railMsg">5 to place</span></div>
  </section>
</div>


<!-- Whose shot it is, said once, when it changes. The ring around the live
     board carries it from then on. -->
<div id="turnCall" hidden><span id="turnCallText">Your shot</span></div>

<!-- Matching. Same card and the same words as the other duels. -->
<div id="wait">
  <div class="waitCard">
    <div class="waitSpin" aria-hidden="true"></div>
    <b id="waitMain">Looking for an opponent</b>
    <span id="waitSub">Free table. Nothing staked.</span>
    <button type="button" id="waitCancel">Back to the lobby</button>
  </div>
</div>

<div id="count" hidden><span id="countNum">3</span></div>

<div id="over" hidden>
  <div class="overCard">
    <p class="overEyebrow" id="overEyebrow">Match over</p>
    <p class="overWho" id="overWho">—</p>
    <p class="overWhy" id="overWhy"></p>
    <div class="overBtns">
      <button type="button" class="ghost" id="againBtn">Play again</button>
      <button type="button" class="go" id="lobbyBtn">Lobby</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/battleshipArt.js"></script>
<script src="js/battleship.js"></script>
</body>
</html>
