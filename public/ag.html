<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>agar.io - DuelSeries</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<!-- Ubuntu Bold, self-hosted (the same files Google Fonts serves for Ubuntu:700; Ubuntu Font Licence in /fonts).
     Linked here only, never from ag.css: the parity harness declares its own Ubuntu face before ag.css. -->
<link rel="stylesheet" href="/fonts/ubuntu.css">
<link rel="stylesheet" href="/css/ag.css">
</head>
<body>
<!-- The game canvas must stay the first canvas in the document. -->
<canvas id="canvas"></canvas>
<!-- Font preloader: text set in Ubuntu makes the browser fetch the face while the page parses
     (a declared face alone is not fetched until something uses it). Hidden under the canvas. -->
<div class="font-family">&nbsp;</div>

<!-- Phone controls (CHOSEN): the same actions as Space and W, and Cash out, held like Q (Owen 2026-10-08: hold
     3 s to cash out, in every room). Hidden on mouse screens and shown only while alive (ag.css). The paid end
     card's styles (cashout.css and its fonts) are added by agScreens.loadPaidStyles in a paid room only. -->
<div class="ag-pad" aria-label="Game controls">
  <button type="button" id="ag-cash" aria-label="Hold to cash out">Cash out</button>
  <button type="button" id="ag-split" aria-label="Split">Split</button>
  <button type="button" id="ag-eject" aria-label="Eject">Eject</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/agWire.js"></script>
<script src="/js/ag/agMath.js"></script>
<script src="/js/ag/agWorld.js"></script>
<script src="/js/ag/agCamera.js"></script>
<script src="/js/ag/agInput.js"></script>
<script src="/js/ag/agRender.js"></script>
<script src="/js/ag/agHud.js"></script>
<script src="/js/ag/agScreens.js"></script>
<script src="/js/ag/agSound.js"></script>
<script src="/js/ag/agNet.js"></script>
<script src="/js/ag/agPortrait.js"></script>
<!-- The paid hand-off (ours): a stake from the lobby's wallet joins its paid room through the paid door, resumes the
     seat after a reconnect or a reload, and buys Play again through the lobby's wallet. The free page never uses it. -->
<script src="/js/ag/agPaid.js"></script>
<!-- Our server runs this game on its own socket.io namespace (server/ag/agSockets.js). The canvas fills the
     window, but the view, zoom, HUD and menu are sized as if the reference page's 90 px ad strip were at the
     bottom (Owen 2026-10-08); the extra 90 px show more map. A phone held upright gets a "turn your phone sideways"
     card, then the reference layout turned on its side (portrait, Owen 2026-10-08, agPortrait.js). -->
<!-- lobby: this page is the DuelSeries lobby's agar frame (its frame element is the lobby's #agar-frame, same origin
     only; a cross-origin parent leaves frameElement null). It then has no menu card: the lobby's agar.io screen holds
     the name, the buy-in, Spectate and the settings (Owen 2026-10-09 midday). A direct visit keeps the menu. -->
<script>
var agInLobbyFrame = false;
try { agInLobbyFrame = !!window.frameElement && window.frameElement.id === 'agar-frame'; } catch (e) { agInLobbyFrame = false; }
window.DUEL_AGAR_CONFIG = { url: '/ag', ghostBannerPx: 90, portrait: true, handoff: true, lobby: agInLobbyFrame };
</script>
<script src="/js/ag/agMain.js"></script>
<!-- The lobby around the game (ours): a Lobby button inside the lobby's frame, and the lobby name in the name box. -->
<script src="/js/ag/agLobby.js"></script>
</body>
</html>
