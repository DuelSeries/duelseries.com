<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tank art · OMG Shooter</title>
<!-- A workbench, not a screen in the game. Every sprite in OMG Shooter is drawn
     by public/js/shooterArt.js, and this page renders that file at a size where
     the drawing can actually be judged: one big tank, the ten guns on it, and
     the tiles at the real ratio with a tank standing next to them for scale. -->
<style>
  :root { --ink:#100e0b; --s2:#1f1b15; --s3:#282219; --tx:#f5f1e8; --tx3:#8d8171; --gold:#f0a830; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ink); color:var(--tx); padding:28px 22px 60px;
         font-family:'Archivo',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif; }
  h1 { margin:0; font-size:22px; font-weight:650; letter-spacing:-0.3px; }
  .eyebrow { margin:0 0 4px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
             letter-spacing:.14em; text-transform:uppercase; color:var(--tx3); }
  h2 { margin:34px 0 12px; font-size:13px; font-weight:600; letter-spacing:.1em;
       text-transform:uppercase; color:var(--tx3); }
  .wrap { max-width:960px; margin:0 auto; }
  .panel { border:1px solid var(--s3); border-radius:14px; overflow:hidden; background:var(--s2); }
  canvas { display:block; width:100%; height:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .cell { border:1px solid var(--s3); border-radius:12px; overflow:hidden; background:var(--s2); }
  .cell b { display:block; padding:8px 10px 9px; font-size:12px; font-weight:600; }
  .cell span { display:block; padding:0 10px 10px; font-size:11px; line-height:1.5; color:var(--tx3); }
  .note { margin:10px 0 0; font-size:12.5px; line-height:1.7; color:var(--tx3); max-width:640px; }
  .note b { color:var(--tx); font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">OMG Shooter</p>
  <h1>Tank art</h1>
  <p class="note">Drawn in code, no image files. Proportions measured off the
    reference at 7&times;: a block is <b>86</b>, a tank is <b>66</b> across, the
    hull <b>53&times;54</b>, each tread band <b>7.5</b> thick, the turret
    <b>33&times;35</b>.</p>

  <h2>Player tank, minigun</h2>
  <div class="panel"><canvas id="hero" width="1400" height="620"></canvas></div>

  <h2>The ten guns</h2>
  <div class="grid" id="guns"></div>

  <h2>Ground and blocks, at the real ratio</h2>
  <div class="panel"><canvas id="tiles" width="1400" height="420"></canvas></div>
</div>

<script src="js/shooterArt.js"></script>
<script>
(function () {
  var A = window.ShooterArt;
  var BLOCK = 86;

  function grassBed(ctx, w, h, s) {
    for (var r = 0; r * s < h + s; r++)
      for (var c = 0; c * s < w + s; c++) A.drawGrass(ctx, c * s, r * s, s, c, r);
  }

  // ── one big tank, turned a little so hull and turret are visibly separate
  var hero = document.getElementById('hero').getContext('2d');
  grassBed(hero, 1400, 620, BLOCK);
  A.drawTank(hero, { x: 470, y: 310, size: 300, hull: 0.42, turret: -0.25,
                     team: 'you', weapon: 'minigun' });
  A.drawTank(hero, { x: 980, y: 250, size: 190, hull: 2.7, turret: 3.05,
                     team: 'them', weapon: 'cannon', hp: 26, max: 45 });
  A.drawTank(hero, { x: 1190, y: 430, size: 190, hull: 1.4, turret: 2.4,
                     team: 'them', weapon: 'rockets' });

  // ── every gun, on its own tank
  var wrap = document.getElementById('guns');
  A.WEAPONS.forEach(function (w) {
    var d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = '<canvas width="320" height="240"></canvas><b>' + w.name +
                  '</b><span>' + w.blurb + '</span>';
    wrap.appendChild(d);
    var g = d.querySelector('canvas').getContext('2d');
    grassBed(g, 320, 240, BLOCK);
    A.drawTank(g, { x: 150, y: 120, size: 150, hull: 0, turret: 0,
                    team: 'you', weapon: w.key });
  });

  // ── the tiles, with a tank standing among them for scale
  var t = document.getElementById('tiles').getContext('2d');
  grassBed(t, 1400, 420, BLOCK);
  var kinds = [A.drawStone, A.drawWood, A.drawBrick, A.drawBarrel];
  for (var i = 0; i < 4; i++) {
    for (var j = 0; j < 2; j++) kinds[i](t, 120 + i * 200, 90 + j * BLOCK, BLOCK);
  }
  A.drawTank(t, { x: 1010, y: 176, size: 66, hull: 0, turret: -0.5,
                  team: 'you', weapon: 'minigun' });
  A.drawStone(t, 1120, 133, BLOCK);
  t.fillStyle = '#f5f1e8';
  t.font = '600 22px Archivo, system-ui, sans-serif';
  t.fillText('tank 66  ·  block 86', 940, 300);
})();
</script>
</body>
</html>
