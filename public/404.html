<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Page not found · DuelSeries</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/legal.css">
<style>
  /* The legal pages' sheet (the kit's tokens and type), with one centred message over a wall of the lineup's card
     art, dimmed like the Coming soon cards (grey, dark, still), a black pool in the middle under the words. */
  html,body{overflow-x:hidden}
  .wall{position:fixed;inset:var(--ds-hdh) 0 0;z-index:0;overflow:hidden;pointer-events:none;display:grid;
    grid-template-columns:repeat(8,minmax(0,1fr));gap:14px;padding:14px;align-content:center}
  .wall img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;border-radius:16px;background:var(--ds-s2);
    filter:grayscale(.9) brightness(.42)}
  .wall::after{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 46% 52% at 50% 50%,#000 42%,rgba(0,0,0,.9) 62%,rgba(0,0,0,.55) 100%)}
  .nf{position:relative;z-index:1;min-height:calc(100vh - var(--ds-hdh));padding:32px 24px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .nf h1{font-size:64px;letter-spacing:-.025em;line-height:1}
  .nf p{margin-top:12px;font-size:19px;color:var(--ds-tx2);max-width:none}
  .acts{display:flex;gap:8px;margin-top:32px;flex-wrap:wrap;justify-content:center}
  .go{min-height:52px;min-width:220px;padding:0 24px;font-size:16px;font-weight:700;background:var(--ds-bone);color:#000}
  .go:hover{background:#fff;box-shadow:0 0 0 4px rgba(244,241,234,.14)}
  .go2{min-height:52px;padding:0 24px;font-size:16px;color:var(--ds-tx2);background:transparent}
  .go2:hover{background:var(--ds-s2);color:var(--ds-bone)}
  @media(min-width:761px) and (max-width:1100px){.wall{grid-template-columns:repeat(6,minmax(0,1fr))}}
  @media(max-width:760px){
    .wall{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:10px}
    .wall img{border-radius:12px}
    .wall::after{background:radial-gradient(ellipse 80% 40% at 50% 50%,#000 44%,rgba(0,0,0,.9) 70%,rgba(0,0,0,.6) 100%)}
    .nf{min-height:calc(100dvh - var(--ds-hdh));padding:24px 16px calc(32px + env(safe-area-inset-bottom))}
    .nf h1{font-size:40px}
    .nf p{font-size:17px}
    .acts{flex-direction:column;align-self:stretch}
    .go,.go2{width:100%;min-width:0}
  }
</style>
</head>
<body>
<!-- Served by server/index.js's last handler for any page path nothing else
     answers. It replaced Express's bare white "Cannot GET /path". -->
<header class="top"><div class="top-in"><a class="brand" href="/">Duel<span>Series</span></a></div></header>
<div class="wall" aria-hidden="true">
  <img src="/img/games/chomp-card.webp?v=1" alt="" decoding="async"><img src="/img/games/snake-card.webp?v=1" alt="" decoding="async"><img src="/img/games/agar-card.webp?v=1" alt="" decoding="async"><img src="/img/games/paper-card.webp?v=1" alt="" decoding="async"><img src="/img/games/headsoccer-card.webp?v=1" alt="" decoding="async"><img src="/img/games/swim-card.webp?v=1" alt="" decoding="async"><img src="/img/games/pool8-card.webp?v=1" alt="" decoding="async"><img src="/img/games/airhockey-card.webp?v=1" alt="" decoding="async">
  <img src="/img/games/knockout-card.webp?v=1" alt="" decoding="async"><img src="/img/games/battleship-card.webp?v=1" alt="" decoding="async"><img src="/img/games/rooftop-card.webp?v=1" alt="" decoding="async"><img src="/img/games/crossy-card.webp?v=1" alt="" decoding="async"><img src="/img/games/tanks-card.webp?v=1" alt="" decoding="async"><img src="/img/games/stumble-card.webp?v=1" alt="" decoding="async"><img src="/img/games/omgshooter-card.webp?v=1" alt="" decoding="async"><img src="/img/games/omgshoot2-card.webp?v=1" alt="" decoding="async">
  <img src="/img/games/chomp-card.webp?v=1" alt="" decoding="async"><img src="/img/games/snake-card.webp?v=1" alt="" decoding="async"><img src="/img/games/agar-card.webp?v=1" alt="" decoding="async"><img src="/img/games/paper-card.webp?v=1" alt="" decoding="async"><img src="/img/games/headsoccer-card.webp?v=1" alt="" decoding="async"><img src="/img/games/swim-card.webp?v=1" alt="" decoding="async"><img src="/img/games/pool8-card.webp?v=1" alt="" decoding="async"><img src="/img/games/airhockey-card.webp?v=1" alt="" decoding="async">
</div>
<main class="nf">
  <h1>Page not found</h1>
  <p>There is nothing at this address.</p>
  <div class="acts">
    <a class="go" href="/">Back to games</a>
    <a class="go2" href="/games">See every game</a>
  </div>
</main>
</body>
</html>
