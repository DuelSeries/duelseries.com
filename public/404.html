<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e0b">
<meta name="robots" content="noindex">
<title>Page not found · DuelSeries</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/legal.css">
<style>
  /* The legal pages' sheet (same tokens and type), with one centred message. */
  .nf{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .nf h1{margin-top:0}
  .nf p{margin-top:10px}
  .nf .go{display:inline-block;margin-top:28px;background:var(--bone);color:#100e0b;text-decoration:none;
    font-weight:650;font-size:15px;padding:13px 22px;border-radius:var(--r2);align-self:flex-start}
</style>
</head>
<body>
<!-- Served by server/index.js's last handler for any page path nothing else
     answers. It replaced Express's bare white "Cannot GET /path". -->
<div class="doc">
  <header class="top"><a class="brand" href="/">Duel<span>Series</span></a></header>
  <main class="nf">
    <h1>Page not found</h1>
    <p>There is nothing at this address.</p>
    <a class="go" href="/">Back to games</a>
  </main>
</div>
</body>
</html>
