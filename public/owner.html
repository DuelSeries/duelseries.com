<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DuelSeries · Control</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Owen's pick "1 · The sheet" (owner-console/picker2.html), copied token for
   token: one table with the games down the side and Free, $0.50 and $1 across,
   a summary row above it and one strip of site controls below. Every number on
   the screen is one the server sent; nothing here is decoration. */
:root{
  --bg:#100e0b; --s1:#16130f; --s2:#1e1a14; --ln:#2a241c; --ln2:#3a3126;
  --tx:#f5f1e8; --tx2:#b3a793; --tx3:#857a6a;
  --ink:#100e0b; --gold:#f0a830; --ok:#8ed081; --bad:#e0705f;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Shared parts, as in the picker. */
.step{display:inline-flex;align-items:center;gap:0;border:1px solid var(--ln);border-radius:9px;height:34px;flex:none}
.step button{width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--tx2);font-size:18px;line-height:1;border-radius:8px}
.step span{min-width:30px;text-align:center;font-weight:600}
/* A number the page is about to send, not one the server has confirmed yet. */
.step.pending span{color:var(--tx2);font-style:italic}
.step.off{opacity:.45}
.tg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden;height:34px;flex:none}
.tg button{border:0;background:none;padding:0 13px;font-size:13.5px;font-weight:600;color:var(--tx3);cursor:pointer}
.tg button.on.y{background:rgba(142,208,129,.14);color:var(--ok)}
.tg button.on.n{background:rgba(224,112,95,.14);color:var(--bad)}
.tg button:disabled{cursor:not-allowed;opacity:.55}
.tg.busy,.btn.busy{opacity:.6}
.btn{border:1px solid var(--ln2);background:none;border-radius:9px;height:34px;padding:0 14px;font-weight:600;font-size:13.5px;cursor:pointer;flex:none}
.btn.main{background:var(--tx);border-color:var(--tx);color:var(--ink)}
.btn.red{color:var(--bad);border-color:rgba(224,112,95,.45)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.step button:disabled{cursor:not-allowed;opacity:.5}
.btn:hover:not(:disabled){border-color:var(--tx3)}
.btn.main:hover:not(:disabled){background:#fff;border-color:#fff}
.step button:hover:not(:disabled),.tg button:hover:not(:disabled):not(.on){background:var(--s2);color:var(--tx)}
/* "Auto": a word, not a button shape, and only there while a room is held. */
.auto{border:0;background:none;padding:4px 2px;font-size:13px;font-weight:600;color:var(--tx2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex:none}
.auto:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;padding:0;font-size:inherit;color:var(--tx2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.gold{color:var(--gold)}
.good{color:var(--ok)}
.dim{color:var(--tx3)}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
input.say{flex:1;min-width:0;height:34px;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:0 12px;color:var(--tx);font:inherit;font-size:14px}
input.say:focus{outline:none;border-color:var(--gold)}
.log{max-height:210px;overflow:auto}
.log div{font-size:13px;color:var(--tx2);padding:3px 0}
.log .t{color:var(--tx3);display:inline-block;width:52px}
.log .no{color:var(--bad)}
.alerts{max-height:210px;overflow:auto;font-size:14px}
.alerts .a{padding:6px 0;border-top:1px solid var(--s2)}
.alerts .a:first-child{border-top:0;padding-top:0}
.alerts .a b{color:var(--bad);font-weight:600;font-size:13.5px}
.alerts .a .t{color:var(--tx3);font-size:12.5px;margin-left:6px}
.alerts .a .x{font-size:13px;color:var(--tx2);overflow-wrap:anywhere}
.alerts .q{padding-bottom:4px}
.status{font-size:13.5px;color:var(--tx2);min-width:0}
.status.bad{color:var(--bad)}

/* Focus you can see on every control. The toggles and steppers clip their
   corners, so their ring sits inside the button rather than being cut off. */
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tg button:focus-visible,.step button:focus-visible{outline-offset:-2px}

/* ═══ PC: the sheet ═══ */
.s1{max-width:1440px;margin:0 auto}
.s1 .hd{display:flex;align-items:baseline;gap:18px;padding:26px 36px 0}
.s1 .hd h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.3px}
.s1 .hd .who{margin-left:auto;color:var(--tx3);font-size:13.5px;flex:none}
.s1 .sum{display:flex;align-items:center;gap:40px;padding:22px 36px 24px;border-bottom:1px solid var(--ln)}
.s1 .verdict{font-size:20px;font-weight:650}
.s1 .verdict small{display:block;font-size:13.5px;font-weight:400;color:var(--tx2);margin-top:2px}
.s1 .fig b{display:block;font-size:22px;font-weight:650}
.s1 .fig span{font-size:13px;color:var(--tx3)}
.s1 .fig span.bad{color:var(--bad)}
.s1 .open{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--tx2)}
.s1 table{width:100%;border-collapse:collapse}
.s1 th{font-size:13px;font-weight:600;color:var(--tx3);text-align:left;padding:14px 18px 10px;border-bottom:1px solid var(--ln)}
.s1 th:first-child,.s1 td:first-child{padding-left:36px}
.s1 th:last-child,.s1 td:last-child{padding-right:36px}
.s1 td{padding:14px 18px;border-bottom:1px solid var(--s2);vertical-align:middle}
.s1 td.g{font-weight:650;font-size:16px;width:180px}
.soonsw{margin-top:6px;font-weight:400}
.soonsw .tg{height:28px}
.soonsw .tg button{padding:0 10px;font-size:12.5px}
.s1 .cell{display:flex;align-items:center;gap:14px}
.s1 .cell .p{width:76px;color:var(--tx2);font-size:14px;flex:none}
.s1 .cell .p b{color:var(--tx);font-weight:600}
.s1 .cell .m{margin-left:auto;font-weight:600;min-width:52px;text-align:right}
.s1 .na{color:var(--tx3);font-size:13.5px}
.s1 td.door{width:150px}
.s1 tr.br td{background:var(--s1)}
.s1 .brline{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.s1 .brline .st{font-weight:600}
.s1 .brline .acts{margin-left:auto;display:flex;gap:8px}
.s1 .low{display:grid;grid-template-columns:1.2fr 1fr 1fr;border-top:1px solid var(--ln)}
.s1 .low>div{padding:20px 36px 26px;border-left:1px solid var(--ln);min-width:0}
.s1 .low>div:first-child{border-left:0}
.s1 .low h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--tx3)}
.s1 .line{display:flex;align-items:center;gap:12px;padding:6px 0}
.s1 .line .l{flex:1}
/* Narrow PCs: the same sheet with less air between things, until it is too
   narrow for a table at all and becomes the phone blocks below. */
@media (max-width:1380px){
  .s1 .sum{gap:28px}
  .s1 .cell{gap:10px}
  .s1 th,.s1 td{padding-left:12px;padding-right:12px}
  .s1 td.g{width:130px}
}

/* ═══ Phone: each game its own block ═══ */
.ph{max-width:640px;margin:0 auto;padding-bottom:28px}
.ph .pt{padding:18px 18px 8px;display:flex;align-items:baseline;gap:10px}
.ph .pt h1{margin:0;font-size:21px;font-weight:650}
.ph .pt .who{margin-left:auto;font-size:12.5px;color:var(--tx3)}
.ph .pst{padding:0 18px 6px}
.ph .pst:empty{display:none}
.ph .pv{padding:4px 18px 4px;font-size:19px;font-weight:650;line-height:1.25}
.ph .pv small{display:block;font-size:13px;font-weight:400;color:var(--tx2);margin-top:3px}
.ph .pf{display:flex;gap:20px;padding:12px 18px 14px;border-bottom:1px solid var(--ln)}
.ph .pf b{display:block;font-size:17px;font-weight:650}
.ph .pf span{font-size:12px;color:var(--tx3)}
.ph .pf span.bad{color:var(--bad)}
.ph .pg{padding:14px 18px 4px;display:flex;align-items:center;gap:10px}
.ph .pg b{font-size:16px;font-weight:650}
.ph .pg .tg,.ph .pg .na,.ph .pg .dim{margin-left:auto}
.ph .pg .tg{height:30px}
.ph .pg .tg button{padding:0 10px;font-size:12.5px}
.ph .pg .dim,.ph .pg .na{font-size:13px;color:var(--tx3)}
.ph .pr{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;padding:8px 18px;border-top:1px solid var(--s2)}
.ph .pr .k{font-weight:600}
.ph .pr .v{font-size:13.5px;color:var(--tx2);min-width:0}
.ph .pr .v b{color:var(--tx)}
.ph .pr .na{font-size:13px;color:var(--tx3);text-align:right}
.ph .pr .sw{display:flex;align-items:center;gap:8px}
.ph .sec{padding:14px 18px;border-top:1px solid var(--ln)}
.ph .sec.acts{display:flex;gap:8px;flex-wrap:wrap;border-top:0;padding-top:6px}
.ph .sec h3{margin:0 0 8px;font-size:13px;color:var(--tx3);font-weight:600}
.ph .line{display:flex;align-items:center;gap:10px;padding:6px 0}
.ph .line .l{flex:1}

/* Sign in, and the screen before the page knows whether this device is in. */
.center{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.card{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--s2);border-radius:14px;padding:28px 26px;text-align:center}
.card h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.2px}
.card p{margin:10px 0 20px;color:var(--tx2);font-size:14px}
.card .why{margin:14px 0 0;font-size:13.5px;color:var(--tx2);min-height:1.45em}
.card .why.bad{color:var(--bad)}
.loading{padding:40px 36px;display:flex;gap:16px;flex-wrap:wrap}

/* Devices: a small panel over the page, not a page of its own. */
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:0;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dhd{display:flex;align-items:center;padding:18px 20px 6px}
.dhd h2{margin:0;font-size:17px;font-weight:650}
.dhd .link{margin-left:auto;font-size:13.5px}
.dnote{margin:0;padding:0 20px 10px;font-size:13px;color:var(--tx3)}
.dv{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--s2)}
.dv .dl{flex:1;min-width:0}
.dv .dl b{display:block;font-weight:600;font-size:14px}
.dv .dl span{display:block;font-size:12.5px;color:var(--tx3)}
.dft{display:flex;align-items:center;gap:12px;padding:12px 20px 18px;border-top:1px solid var(--ln)}
.dft .status{flex:1}

/* ═══ Live and Today (public/js/ownerLive.js): the real people in every lobby, pushed as they come ═══ */
.lvtabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;max-width:1440px;margin:0 auto;padding:10px 36px 0;background:var(--bg);border-bottom:1px solid var(--ln)}
.lvtabs button{border:0;background:none;padding:8px 12px 10px;margin-bottom:-1px;font-weight:600;font-size:14.5px;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px}
.lvtabs button.on{color:var(--tx);border-bottom-color:var(--gold)}
.lvtabs button:hover:not(.on){color:var(--tx2)}
.lvbadge{background:var(--ok);color:var(--ink);border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:12.5px;font-weight:700;display:inline-grid;place-items:center}
main:not([data-tab="live"]) #live,main:not([data-tab="today"]) #today,main[data-tab="live"] #panel,main[data-tab="today"] #panel{display:none}
.lv{max-width:1100px;margin:0 auto;padding:0 36px 40px}
.lvtop{display:flex;align-items:flex-end;gap:18px;padding:24px 0 18px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.lvbig{font-size:22px;font-weight:650;letter-spacing:-.2px}
.lvbig.ok{color:var(--ok)}
.lvsub{font-size:13.5px;color:var(--tx2);margin-top:3px}
.lvctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvconn{font-size:13px;color:var(--tx3);display:inline-flex;align-items:center;gap:6px;margin-right:4px}
.lvconn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.lvconn.on{color:var(--ok)}
.lvconn.on::before{background:var(--ok)}
.lvrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;margin:0 -16px;padding:12px 16px;border-bottom:1px solid var(--s2)}
.lvrow .lvn{font-size:26px;font-weight:650;text-align:right;color:var(--tx3);padding-right:6px}
.lvrow.has{background:var(--s1);box-shadow:inset 3px 0 0 var(--ok)}
.lvrow.has .lvn{color:var(--ok)}
.lvrow.soon{opacity:.55}
.lvname b{font-weight:650;font-size:15.5px}
.lvrung{margin-left:8px;font-size:13px;color:var(--tx2);font-weight:600}
.lvrung.paid{color:var(--gold)}
.lvnames{font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.lvextra{font-size:12.5px;color:var(--tx3);margin-top:2px}
.lvextra:empty{display:none}
.lvtestbox{margin-top:26px}
.lvtestbox h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--tx3)}
.lvnote{margin:0 0 10px;font-size:13px}
.lvt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:6px 0;border-top:1px solid var(--s2);font-size:13.5px;color:var(--tx3)}
.lvt .lvtn{color:var(--tx2);overflow-wrap:anywhere}
.lvtoasts{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:10px;width:min(380px,calc(100vw - 32px))}
.lvtoast{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--ln2);border-radius:12px;padding:12px 12px 12px 16px;box-shadow:inset 3px 0 0 var(--ok),0 10px 30px rgba(0,0,0,.45);animation:lvin .18s ease-out}
.lvtoast.out{opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.lvtx{flex:1;min-width:0;display:flex;flex-direction:column}
.lvtx b{font-size:15.5px;font-weight:650;overflow-wrap:anywhere}
.lvtx span{font-size:13.5px;color:var(--tx2)}
.lvtx span.dim{font-size:12px;color:var(--tx3)}
.lvx{font-size:12.5px;color:var(--tx3)}
@keyframes lvin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lvchart{padding:22px 0 8px}
.lvbars{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:4px;height:140px;align-items:end}
.lvbars span{height:100%;display:flex;align-items:flex-end;background:var(--s1);border-radius:3px}
.lvbars span.now{box-shadow:inset 0 -2px 0 var(--gold)}
.lvbars i{display:block;width:100%;background:var(--ok);border-radius:3px}
.lvbars.sm{height:28px;gap:2px}
.lvaxis{display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;color:var(--tx3);padding-top:6px}
.lvdrow{display:grid;grid-template-columns:minmax(0,1.3fr) 80px 140px minmax(0,1.6fr);gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--s2)}
.lvdh{font-size:13px;color:var(--tx3);font-weight:600;border-bottom-color:var(--ln);padding-top:18px}
.lvdn b{font-weight:650}
.lvdv{font-weight:600}
.lv .tg button.on{background:var(--s2);color:var(--tx)}
@media (max-width:700px){
  .lvtabs{padding:6px 8px 0}
  .lv{padding:0 16px 32px}
  .lvtop{padding:18px 0 14px}
  .lvbig{font-size:19px}
  .lvctl{margin-left:0}
  .lvrow{grid-template-columns:40px minmax(0,1fr) auto;gap:10px}
  .lvrow .lvn{font-size:22px;padding-right:2px}
  .lvtoasts{left:12px;right:12px;bottom:12px;width:auto}
  .lvbars{height:110px;gap:2px}
  .lvdrow{grid-template-columns:minmax(0,1fr) 56px 92px;gap:8px}
  .lvdrow .lvbars.sm{grid-column:1/-1}
  .lvdh span:last-child{display:none}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <section id="boot" class="center">
    <div class="card">
      <p class="why" id="bootWhy">Checking this device…</p>
      <button type="button" class="btn" id="bootRetry" hidden>Try again</button>
    </div>
  </section>

  <section id="signin" class="center" hidden>
    <div class="card">
      <h1>Sign in once on this device</h1>
      <p>Sign in with the owner wallet one time. This device then stays signed in for a year, or until you sign it out under Devices.</p>
      <!-- The widget publishes globals and renders nothing visible. #wallet-root
           is where its hidden Privy iframe lives and must exist, or the whole
           widget bails without mounting. It is only loaded once Sign in is
           pressed: a signed-in device never touches the wallet at all. -->
      <div id="wallet-root"></div>
      <button type="button" class="btn main" id="signinBtn">Sign in</button>
      <p class="why" id="signinWhy" role="status" aria-live="polite"></p>
    </div>
  </section>

  <div id="panel" hidden></div>
</main>

<!-- Parts that outlive a redraw: the status line and the alerts list move into
     whichever layout is on screen, so a message or an alert is never wiped by
     the phone and PC layouts swapping. -->
<div hidden>
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <div id="alerts" class="alerts"></div>
</div>

<dialog id="devices" aria-labelledby="devTitle">
  <div class="dhd"><h2 id="devTitle">Devices</h2><button type="button" class="link" id="devClose">Close</button></div>
  <p class="dnote">Each device stays signed in for a year from when it signed in.</p>
  <div id="devList"></div>
  <div class="dft"><span class="status" id="devStatus" role="status" aria-live="polite"></span><button type="button" class="btn red" id="devOthers">Sign out everywhere else</button></div>
</dialog>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/ownerAlerts.js"></script>
<script src="/js/ownerLive.js"></script>
<script>
'use strict';
/* The owner console. A device signs in once with the owner wallet and the
   server hands it a year-long session cookie (HttpOnly, so this script never
   sees it). After that nothing here signs anything: every read and every
   button is a plain same-origin request that carries the cookie and the
   X-DS-Owner header, and the wallet widget is not even loaded. */

const $ = (id) => document.getElementById(id);

/* Builds DOM. Every string handed to it becomes a text node, never markup, so
   a room name, a player's name in the battle royale or a note in the log can
   never turn into HTML however it was written. */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k === 'hidden' || k === 'disabled') el[k] = true;
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

const num = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : Number(v) || 0);
const money = (v) => { const n = num(v); return Math.abs(n) < 0.005 ? '$0' : '$' + n.toFixed(2); };
// Whole dollars without the cents: "$20 prize", as on the Events tab.
const dollars = (v) => { const n = num(v); return Number.isInteger(n) ? '$' + n : money(n); };
const people = (n) => (num(n) === 1 ? 'person' : 'people');
const sentence = (t) => { const s = String(t || '').trim(); return !s || /[.!?]$/.test(s) ? s : s + '.'; };
/* A time from the server as epoch ms, whether it came as ms, as seconds or as
   an ISO string; 0 when it is none of those. */
function toMs(v) {
  if (typeof v === 'string' && v && !/^\d+(\.\d+)?$/.test(v)) { const t = Date.parse(v); return Number.isFinite(t) ? t : 0; }
  const n = num(v);
  return n > 0 && n < 1e12 ? n * 1000 : n;
}
// "8:05 pm" in whatever time zone this device is in; tight is the log's "7:42pm".
function clock(ms, tight) {
  const d = new Date(toMs(ms));
  if (isNaN(d.getTime())) return '';

/* The battle royale in words: what it is doing, then the facts that matter.
   People, never bodies: bots fill the room and are not who Owen is waiting for. */
function brWord(b) {
  if (b.state === 'waiting') return 'Waiting';
  if (b.state === 'countdown') {
    const left = Math.max(0, num(b.countdownMs) - (Date.now() - S.got));
    return 'Starting in ' + Math.ceil(left / 1000) + ' s';
  }
  if (b.state === 'running') return 'Running';
  if (b.state === 'over') return 'Over';
  if (b.state === 'reopening') return 'Reopening';

  return t.charAt(0).toUpperCase() + t.slice(1);
}
function brStartsAt(b) {
  const at = toMs(b.nextStartAt) || (b.nextStartMs != null ? S.got + num(b.nextStartMs) : 0);
  if (!at) return '';
  const d = new Date(at);
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const day = sameDay(d, new Date()) ? '' : sameDay(d, tomorrow) ? 'tomorrow ' : d.toLocaleDateString([], { weekday: 'long' }) + ' ';
  return day + 'at ' + clock(at);
}
function brPrize(b) {

  return num(b.prize) > 0 ? dollars(b.prize) + ' prize' : 'no prize';
}
function brInfo(b) {

  if (b.state === 'running') parts.push(num(b.alive) + ' alive');
  if (b.state === 'over' && b.winner && b.winner.name) parts.push('won by ' + b.winner.name);
  if (b.state !== 'running' && b.state !== 'countdown') { const t = brStartsAt(b); if (t) parts.push('starts by itself ' + t); }
  parts.push(brPrize(b));
  return parts.join(', ');
}
function brShort(b) {
  const parts = [];
  if (b.state === 'running') parts.push(num(b.alive) + ' alive');
  else if (b.state === 'over' && b.winner && b.winner.name) parts.push('won by ' + b.winner.name);
  else if (b.state !== 'countdown') { const t = brStartsAt(b); if (t) parts.push('starts ' + t.replace(/\bat /, '')); }

}

function copyText(a, what) {

/* Alerts arrive on their own socket, between polls, newest first. The empty
   state says whether the socket is actually listening: "nothing wrong" from a
   socket that is not connected would be a lie. */
const alertList = [];
let alertState = 'connecting';
const alertsEl = $('alerts');
function alertNote() {
  if (alertState === 'listening') return '';
  if (alertState === 'connecting') return 'Connecting to alerts…';
  if (alertState === 'offline') return 'Alerts lost the server. Reconnecting.';
  if (alertState === 'unsigned') return 'Alerts would not sign in. Reload the page.';
  if (alertState === 'unavailable') return 'Alerts did not load. Reload the page.';
  return 'Alerts are not connected.';
}
let alertsDrawn = '';
function drawAlerts() {
  const sig = alertState + '|' + alertList.length + '|' + (alertList[0] ? alertList[0].at : 0);
  if (sig === alertsDrawn) return;
  alertsDrawn = sig;
  const note = alertNote();
  const kids = [];
  const noteCls = alertState === 'connecting' ? 'q dim' : 'q bad';
  if (!alertList.length) kids.push(h('div', { class: note ? noteCls : 'q dim', text: note || 'Nothing wrong right now.' }));
  else if (note) kids.push(h('div', { class: noteCls, text: note }));
  for (const a of alertList) {
    const x = h('div', { class: 'x' });
    x.textContent = String(a.text || '');
    kids.push(h('div', { class: 'a' }, h('b', { text: String(a.title || 'Alert') }), h('span', { class: 't', text: clock(a.at) }), x));
  }
  alertsEl.replaceChildren(...kids);
}

    const rows = s.audit.filter((a) => toMs(a.at) >= start.getTime());
    const sig = JSON.stringify(rows.map((a) => [a.at, a.action, a.note, a.ok, a.who]));
    if (sig === drawn) return;
    drawn = sig;
    if (!rows.length) { box.replaceChildren(h('div', { class: 'dim', text: 'Nothing yet today.' })); return; }
    box.replaceChildren(...rows.map((a) => h('div', {
      class: a.ok === false ? 'no' : null,
      title: [String(a.action || ''), a.who ? 'by ' + String(a.who) : '', a.ok === false ? 'refused' : ''].filter(Boolean).join(', '),
    }, h('span', { class: 't', text: clock(a.at, true) }), String(a.note || a.action || ''))));
  });
  return box;
}

  site.append(up);

  return h('div', { class: 'ph' }, pt, pst, pv, pf, pparts, blocks, site,
    h('div', { class: 'sec' }, h('h3', null, 'Alerts'), partAlerts(ups)),
    h('div', { class: 'sec' }, h('h3', null, 'Done today'), partLog(ups)));
}
function phRow(ups, gid, c) {
  const g0 = game(S, gid);
  const r0 = rungAt(g0, c);
  if (!r0) return null;
  const pb = h('b');
  const pw = h('span');
  const sep = h('span');
  const ms = h('span', { class: 'gold' });
  let right;
  if (g0.duel) right = h('span', { class: 'na' }, c === 0 ? 'bot joins after 15 s' : 'people only');
  else if (!r0.room) right = h('span', { class: 'na' }, 'not running');
  else { const [st, auto] = rungStepper(ups, gid, c); right = h('span', { class: 'sw' }, auto, st); }
  ups.push((s) => {
    const r = rungAt(game(s, gid), c) || {};
    const v = num(r.money);
    pb.textContent = String(num(r.people));
    pw.textContent = ' ' + people(r.people);
    const showMoney = c !== 0 && v > 0.005;
    sep.textContent = showMoney ? ' · ' : '';
    ms.textContent = showMoney ? money(v) : '';
  });
  return h('div', { class: 'pr' }, h('span', { class: 'k' }, COL_NAME[c]), h('span', { class: 'v' }, pb, pw, sep, ms), right);
}
function phBr(ups) {
  const st = h('span', { class: 'dim' });
  const info = h('span', { class: 'v' });
  ups.push((s) => {
    const b = s.battleRoyale || {};
    st.textContent = brWord(b) + ' · ' + num(b.humans) + ' ' + people(b.humans);
    info.textContent = brShort(b);
  });
  let right = h('span');
  if (S.battleRoyale.room) {
    const [step, auto] = stepper(ups, { key: 'bots:br', label: 'battle royale', get: brRung });
    right = h('span', { class: 'sw' }, auto, step);
  }
  return [
    h('div', { class: 'pg' }, h('b', null, 'Battle royale'), st),
    h('div', { class: 'pr' }, h('span', { class: 'k' }, 'Bots'), info, right),
    h('div', { class: 'sec acts' }, brButtons(ups)),
    h('div', { class: 'pr' }, h('span', { class: 'k' }, 'Engine'), h('span'), brEngine(ups)),
  ];
}

// Crossing between the PC sheet and the phone blocks redraws from the state on hand.
if (mq) {
  const relayout = () => { if (S && view && mode === 'panel') { build(shapeOf(S)); update(); } };
  if (typeof mq.addEventListener === 'function') mq.addEventListener('change', relayout);
  else if (typeof mq.addListener === 'function') mq.addListener(relayout);
}

/* ── alerts ────────────────────────────────────────────────────────────────
   The socket proves itself with a one-time ticket the session buys over HTTP
   (public/js/ownerAlerts.js, ticket mode). sign is the older way in, kept for
   a module that does not know tickets yet: it only works if this tab loaded
   the wallet to sign in, and otherwise says no. */
let alertSocket = null;
async function signed(action, args) {
  if (typeof window.duelWalletSignAction !== 'function') return null;
  try {
    return await Promise.race([
      window.duelWalletSignAction(action, args || {}),
      new Promise((resolve) => setTimeout(() => resolve(null), 10000)),
    ]);
  } catch (e) {
    return null;
  }
}
async function alertTicket() {
  try {
    const r = await api('POST', '/api/owner/ticket', {});
    return r.ok && typeof r.body.ticket === 'string' && r.body.ticket ? r.body.ticket : null;
  } catch (e) {
    return null;
  }
}
function startAlerts() {
  if (alertSocket || mode !== 'panel') return;
  if (typeof window.io !== 'function' || !window.OwnerAlerts || typeof window.OwnerAlerts.connectOwnerAlerts !== 'function') {
    if (alertState !== 'unavailable') { alertState = 'unavailable'; update(); }
    return;
  }
  try {
    alertSocket = OwnerAlerts.connectOwnerAlerts({ io, sign: signed, ticket: alertTicket,
      onState: (st) => { alertState = String(st || ''); update(); if (window.OwnerLive) OwnerLive.state(st); },
      onAlert: (a) => {
        if (!a || typeof a !== 'object') return;
        alertList.unshift({ title: String(a.title || 'Alert'), text: String(a.text || ''), at: num(a.at) || Date.now() });
        if (alertList.length > 30) alertList.length = 30;
        say(String(a.title || 'Alert') + ': ' + String(a.text || ''), true);
        update();
      },
    });
    if (window.OwnerLive) OwnerLive.attach(alertSocket);   // the Live and Today tabs ride the same owner socket
  } catch (e) {
    alertSocket = null;
    alertState = 'unavailable';
    update();
  }
}
function stopAlerts() {
  if (window.OwnerLive) OwnerLive.stop();
  try { if (alertSocket && typeof alertSocket.disconnect === 'function') alertSocket.disconnect(); } catch (_) { /* gone already */ }
  alertSocket = null;
  alertState = 'connecting';
}

/* ── screens ───────────────────────────────────────────────────────────── */
function show(which) {
  $('boot').hidden = which !== 'boot';
  $('signin').hidden = which !== 'signin';
  panelEl.hidden = which !== 'panel';
}
function why(text, bad) {
  const el = $('signinWhy');
  el.textContent = text || '';
  el.className = 'why' + (bad ? ' bad' : '');
}
function toSignIn(reason) {
  mode = 'signin';
  stopPoll();
  stopAlerts();
  for (const p of pend.values()) clearTimeout(p.timer);
  pend.clear();
  S = null;
  view = null;
  panelEl.replaceChildren();
  closeDevices();
  show('signin');
  why(reason || '', !!reason);
}
async function enterPanel() {
  mode = 'panel';
  show('panel');
  if (!view) panelEl.replaceChildren(h('div', { class: 'loading' }, h('span', { class: 'dim' }, 'Loading the console…'), statusEl));
  await refresh();
  if (mode === 'panel') startPoll();
}

/* ── sign in, once per device ──────────────────────────────────────────────
   Only now does the wallet widget load. The owner signs one message,
   owner:session:create over a nonce the server just issued for this browser,
   and the server answers with the session cookie. */
let widgetLoad = null;
function loadWidget() {
  if (widgetLoad) return widgetLoad;
  widgetLoad = new Promise((resolve, reject) => {
    /* The widget is a React island that expects node globals; the shim has to
       run before it loads, exactly as on the lobby. */
    window.global = window.global || window; window.process = window.process || { env: { NODE_ENV: 'production' } };
    const tag = document.createElement('script');
    tag.src = '/wallet/widget.js';
    tag.onload = () => resolve();
    tag.onerror = () => { widgetLoad = null; tag.remove(); reject(new Error('The sign-in widget did not load. Check the connection and try again.')); };
    document.body.appendChild(tag);
  });
  return widgetLoad;
}
// Resolves true once pred(window.duelWallet) holds, false after ms.
function walletWhen(pred, ms) {
  return new Promise((resolve) => {
    let timer = 0;
    const done = (v) => { clearTimeout(timer); window.removeEventListener('duelwallet:change', check); resolve(v); };
    const check = () => { const w = window.duelWallet; if (w && pred(w)) done(true); };
    timer = setTimeout(() => done(false), ms);
    window.addEventListener('duelwallet:change', check);
    check();
  });
}
function openWalletLogin() {
  if (typeof window.duelWalletLogin !== 'function') return false;
  Promise.resolve().then(() => window.duelWalletLogin()).catch(() => {});
  return true;
}
let signingIn = false;
let waitingForLogin = false;
async function signIn() {
  const btn = $('signinBtn');
  if (signingIn) {
    // Privy's window was closed without signing in: pressing again reopens it.
    if (waitingForLogin) openWalletLogin();
    return;
  }
  signingIn = true;
  btn.disabled = true;
  try {
    why('Loading the wallet…');
    await loadWidget();
    if (!(await walletWhen((w) => w.ready, 20000))) throw new Error('The wallet did not start. Reload the page and try again.');
    // Signed in to Privy already (the lobby, earlier): the address can lag the flag by a moment.
    if (window.duelWallet.authenticated && !window.duelWallet.address) await walletWhen((w) => w.address, 10000);
    if (!window.duelWallet.authenticated || !window.duelWallet.address) {
      if (!openWalletLogin()) throw new Error('The wallet has no sign-in. Reload the page and try again.');
      why('Finish signing in to the owner wallet in the window that opened.');
      waitingForLogin = true;
      btn.disabled = false;
      btn.textContent = 'Open the sign-in again';
      const authed = await walletWhen((w) => w.authenticated && w.address, 10 * 60 * 1000);
      waitingForLogin = false;
      btn.disabled = true;
      btn.textContent = 'Sign in';
      if (!authed) throw new Error('The wallet sign-in was not finished. Press Sign in to try again.');
    }
    why('Asking the server for a sign-in code…');
    const ch = await api('GET', '/api/owner/session/challenge');
    if (!ch.ok || typeof ch.body.nonce !== 'string') throw new Error(sentence(ch.body.error) || 'The server did not give a sign-in code (' + ch.status + ').');
    const args = { nonce: ch.body.nonce, host: String(ch.body.host || location.host), label: deviceLabel() };
    why('Signing with the owner wallet…');
    if (typeof window.duelWalletSignAction !== 'function') throw new Error('The wallet cannot sign. Reload the page and try again.');
    let proof = null;
    try {
      proof = await Promise.race([
        window.duelWalletSignAction('owner:session:create', args),
        new Promise((resolve) => setTimeout(() => resolve(null), 20000)),
      ]);
    } catch (e) {
      throw new Error('The wallet would not sign: ' + (e && e.message ? e.message : String(e)));
    }
    if (!proof) throw new Error('The wallet did not sign. Try again.');
    const r = await api('POST', '/api/owner/session/login', proof);
    if (!r.ok || r.body.ok !== true) {
      throw new Error(r.status === 403 ? 'That wallet does not own this server.'
        : sentence(r.body.error) || 'The server refused the sign-in (' + r.status + ').');
    }
    why('');
    await enterPanel();
  } catch (e) {
    why(e && e.message ? e.message : 'Sign-in did not work. Try again.', true);
  } finally {
    signingIn = false;
    waitingForLogin = false;
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}
$('signinBtn').addEventListener('click', () => { signIn(); });

/* ── devices ───────────────────────────────────────────────────────────── */
const dlg = $('devices');
let devBusy = false;
function devStatus(text, bad) {
  const el = $('devStatus');
  el.textContent = text || '';
  el.className = 'status' + (bad ? ' bad' : '');
}
function closeDevices() {
  if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
}
async function openDevices() {
  if (!dlg.open) { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); }
  await loadDevices();
}
async function loadDevices() {
  devStatus('Loading…');
  const r = await api('GET', '/api/owner/sessions');
  if (r.status === 401 || r.status === 403) { toSignIn(reasonFor(r.status)); return; }
  if (!r.ok) { devStatus(sentence(r.body.error) || 'Could not load the list (' + r.status + ').', true); return; }
  // This device first, then the others newest first.
  const list = (Array.isArray(r.body.sessions) ? r.body.sessions.filter((d) => d && typeof d === 'object') : [])
    .sort((a, b) => (b.current ? 1 : 0) - (a.current ? 1 : 0) || toMs(b.lastSeen) - toMs(a.lastSeen));
  devStatus('');
  $('devList').replaceChildren(...(list.length ? list.map(devRow) : [h('p', { class: 'dnote', text: 'No devices are signed in.' })]));
  $('devOthers').disabled = !list.some((d) => !d.current);
}
function devRow(d) {
  const meta = [d.current ? 'this device' : '', d.lastSeen ? 'last seen ' + when(d.lastSeen) : '',
    d.createdAt ? 'signed in ' + when(d.createdAt) : ''].filter(Boolean).join(', ');
  const out = h('button', { type: 'button', class: 'btn', text: 'Sign out' });
  out.addEventListener('click', () => { if (d.current) signOutHere(out); else revoke({ id: d.id }, out); });
  return h('div', { class: 'dv' }, h('div', { class: 'dl' }, h('b', { text: String(d.device || 'Unknown device') }), h('span', { text: meta })), out);
}
async function revoke(body, btn) {
  if (devBusy) return;
  devBusy = true;
  if (btn) btn.disabled = true;
  try {
    const r = await api('POST', '/api/owner/session/revoke', body);
    if (r.status === 401 || r.status === 403) { toSignIn(reasonFor(r.status)); return; }
    if (!r.ok || r.body.ok === false) { devStatus(sentence(r.body.error) || 'Refused (' + r.status + ').', true); return; }
    await loadDevices();
    devStatus(body.others ? 'Signed out everywhere else.' : 'Signed out.');
  } finally {
    devBusy = false;
    if (btn) btn.disabled = false;
  }
}
async function signOutHere(btn) {
  if (devBusy) return;
  devBusy = true;
  if (btn) btn.disabled = true;
  try {
    const r = await api('POST', '/api/owner/session/logout', {});
    if (!r.ok) { devStatus(sentence(r.body.error) || 'The server did not sign this device out (' + r.status + '). Try again.', true); return; }
    toSignIn('Signed out on this device.');
    why('Signed out on this device.', false);
  } finally {
    devBusy = false;
    if (btn) btn.disabled = false;
  }
}
$('devClose').addEventListener('click', () => { closeDevices(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) closeDevices(); });
$('devOthers').addEventListener('click', () => {
  if (!window.confirm('Sign out every other device?\n\nEach one needs the owner wallet to sign in again. This device stays signed in.')) return;
  revoke({ others: true }, $('devOthers'));
});

/* ── start ─────────────────────────────────────────────────────────────── */
async function boot() {
  mode = 'boot';
  show('boot');
  $('bootRetry').hidden = true;
  $('bootWhy').className = 'why';
  $('bootWhy').textContent = 'Checking this device…';
  const r = await api('GET', '/api/owner/session');
  if (r.ok && r.body.signedIn === true) { await enterPanel(); return; }
  if (r.ok || r.status === 401 || r.status === 403) { toSignIn(''); return; }
  $('bootWhy').className = 'why bad';
  $('bootWhy').textContent = r.status === 0 ? 'Could not reach the server. It may be restarting.'
    : 'The server did not answer the sign-in check (' + r.status + ').';
  $('bootRetry').hidden = false;
}
$('bootRetry').addEventListener('click', () => { boot(); });
boot();
</script>
</body>
</html>
