<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rooftop Snipers · DuelSeries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo is the wait card's; the match's own lettering is drawn square by square (rtFont.js). -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/rooftop.css">
</head>
<body>

<!-- The whole match: the sky, the city, the roof, the two snipers, the score, the
     round's label, the pause button and, on a phone, the two touch buttons. One
     canvas, painted in the reference's own small pixels and blown up, because
     that is where its chunky look comes from (rooftop.js). -->
<canvas id="roof"></canvas>

<!-- Held upright: the reference's "play in landscape" card. -->
<div id="rotate" hidden>
  <div class="rotPhone" aria-hidden="true"></div>
  <b>Turn your phone sideways</b>
  <span>Rooftop Snipers plays in landscape. The match keeps going while you turn.</span>
</div>

<!-- Watching somebody else's match: what happened, in a line under the score.
     Lobby, previous and next are the shared Spectate bar (dsWatchBar.js). -->
<div id="watchLine" role="status" hidden></div>

<!-- Waiting for somebody. Honest about the bot rather than quietly substituting
     one: you should know who you are playing. The same card, and the same words,
     as Knockout's. -->
<div id="wait">
  <div class="waitCard">
    <div class="waitSpin" aria-hidden="true"></div>
    <b id="waitMain">Looking for an opponent</b>
    <span id="waitSub">Free table. Nothing staked.</span>
    <button type="button" id="waitCancel">Back to the lobby</button>
  </div>
</div>

<!-- Said when the opponent is the bot a free table gets after a minute alone. -->
<div id="botNote" role="status" hidden>Playing a bot</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/shopSkins.js"></script>
<script src="/shared/rtSim.js"></script>
<!-- The result card every DuelSeries game ends on. -->
<script src="/js/shared/dsEnd.js"></script>
<script src="/js/shared/dsChat.js"></script>
<!-- The pause button's question (an online match cannot pause: it offers the way out). -->
<script src="/js/shared/dsDialog.js"></script>
<script src="/js/dsSfx.js"></script><script src="/js/dsSfxGame.js"></script><script src="/js/rooftopSound.js"></script>
<!-- The Spectate controls every game shares: Lobby, previous and next, and the empty table. -->
<script src="/js/shared/dsEmptyArena.js"></script>
<script src="/js/shared/dsWatchBar.js"></script>
<script src="/js/shared/dsIdentify.js"></script>
<script src="/js/shared/dsSeatHold.js"></script>
<script src="/js/rooftop/rtFont.js"></script><script src="/js/rooftop/rtArt.js"></script>
<!-- The free looks Customize offers (the page sends the stored one in rt:queue; the server keeps only a listed id). -->
<script src="/shared/rtLooks.js"></script>
<script src="/shared/duelWait.js"></script>
<!-- The ping and FPS box every game shares (bottom right). -->
<script src="/js/shared/dsPerfHud.js"></script>
<script src="/js/rooftop.js"></script>
</body>
</html>
