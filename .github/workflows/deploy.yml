name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy-na:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to NA (Canada)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Elastic IP, set 2026-09-02. Deploys broke when the server was resized
          # to t3.micro: that released its auto-assigned address, and the EC2_HOST
          # secret still held the old one, so SSH went nowhere.
          #
          # Held here rather than in a secret because it is not one. The domain
          # resolves to this address publicly, so anyone can already look it up.
          # The SSH key is the actual secret and stays in EC2_KEY. Keeping the
          # host in the repo also means it can be fixed with a normal commit
          # instead of needing repo-admin access to edit secrets.
          #
          # It is an Elastic IP now, so it survives stop/start and should not
          # need changing again.
          host: 16.54.23.244
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/duelseries
            git fetch origin main
            git reset --hard origin/main
            npm install --production
            pm2 restart duelseries
            # Backend pass 2026-10-30: pm2 restart returns 0 even when the new build never comes up, so the deploy
            # push said "deployed" either way. The job now fails (and the push says FAILED) unless the server answers
            # /healthz within 30 s and still answers 10 s later (a boot that crashes after listening). Nothing from
            # the box is printed: this repo is public and so are its Actions logs.
            up=0
            for i in $(seq 1 30); do
              if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:3000/healthz; then up=1; break; fi
              sleep 1
            done
            if [ "$up" != 1 ]; then echo "the server did not answer /healthz within 30 s of the restart"; exit 1; fi
            sleep 10
            if ! curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:3000/healthz; then
              echo "the server answered after the restart, then stopped answering"; exit 1
            fi
            echo "server up after the restart"

  # === EU deploy DISABLED while the EU server (duelseries-eu) is stopped to save cost. ===
  # To re-enable at launch:
  #   1. Start the EU EC2 instance in eu-west-1 (Ireland).
  #   2. Update the EC2_EU_HOST GitHub secret with its NEW public IP (the IP changes on start).
  #   3. Uncomment the deploy-eu job below, AND restore "deploy-eu" in the notify job's
  #      `needs:` list and status check.
  #   (The next push then runs `git reset --hard`, so EU auto-catches-up no matter how stale.)
  # deploy-eu:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Deploy to EU (Ireland)
  #       uses: appleboy/ssh-action@v1.0.3
  #       with:
  #         host: ${{ secrets.EC2_EU_HOST }}
  #         username: ${{ secrets.EC2_EU_USER }}
  #         key: ${{ secrets.EC2_EU_KEY }}
  #         script: |
  #           cd /home/ubuntu/duelseries
  #           git fetch origin main
  #           git reset --hard origin/main
  #           npm install --production
  #           pm2 restart duelseries-eu

  notify:
    needs: [deploy-na]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy finished (ntfy)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          NA_RESULT: ${{ needs.deploy-na.result }}
          # Night review 2026-10-29: an ntfy.sh topic is readable by anyone who knows its name, and this one is in
          # git. Set the repo secret NTFY_DEPLOY_URL to a long random topic URL to move it; until then, today's
          # topic. Only the commit's first line is sent: the body can describe a fix in detail.
          NTFY_URL: ${{ secrets.NTFY_DEPLOY_URL || 'https://ntfy.sh/duelseries-deploy-8382' }}
        run: |
          if [ "$NA_RESULT" = "success" ]; then
            STATUS="deployed ✅"
          else
            STATUS="FAILED ❌ (na:$NA_RESULT)"
          fi
          # Backend pass 2026-10-30: one run (2026-10-31 00:46 UTC) went red because ntfy.sh did not answer for two
          # minutes, though the deploy itself had succeeded. Retried, and capped, so a slow ntfy cannot hang the job.
          curl -s --max-time 15 --retry 4 --retry-delay 5 --retry-all-errors \
            -H "Title: DuelSeries $STATUS" \
            -H "Tags: rocket" \
            -d "$(printf '%s\n' "$COMMIT_MSG" | head -n 1)" \
            "$NTFY_URL"
